}

// Neon meme billboard on a pole (decorative, behind gameplay)
function renderMemeSign(ctx, camera, sign, time) {
  const sx = sign.x - camera.x;
  if (sx < -240 || sx > CONFIG.VIRTUAL_WIDTH + 240) return;

  const groundY = 432 - camera.y;
  const signY = groundY - (sign.h || 150); // panel top
  const color = sign.color || '#00FF88';

  ctx.font = 'bold ' + (sign.size || 20) + 'px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const textW = ctx.measureText(sign.text).width;
  const panelW = textW + 36;
  const panelH = (sign.size || 20) + 26;

  // Pole
  ctx.fillStyle = '#2a2a48';
  ctx.fillRect(sx - 3, signY + panelH, 6, groundY - signY - panelH);

  // Panel
  ctx.fillStyle = 'rgba(8, 8, 24, 0.92)';
  ctx.fillRect(sx - panelW / 2, signY, panelW, panelH);
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.globalAlpha = 0.5 + Math.sin(time * 3 + sign.x) * 0.2;
  ctx.strokeRect(sx - panelW / 2, signY, panelW, panelH);
  ctx.globalAlpha = 1;

  // Neon text with glow (flickers occasionally, like any honest neon sign)
  const flicker = Math.sin(time * 13 + sign.x * 0.7) > -0.92 ? 1 : 0.4;
  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = 12 * flicker;
  ctx.globalAlpha = flicker;
  ctx.fillStyle = color;
  ctx.fillText(sign.text, sx, signY + panelH / 2 + 1);
  ctx.restore();
}

// Soft ground shadow under an entity (only drawn while it stands on something)
function renderEntityShadow(ctx, camera, e) {
  if (!e.onGround || e.alive === false) return;
  const sx = e.x - camera.x + e.width / 2;
  const sy = e.y + e.height - camera.y + 2;
  ctx.globalAlpha = 0.22;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(sx, sy, e.width * 0.45, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

// Subtle vignette for depth (cached gradient)
let vignetteGradient = null;
function renderVignette(ctx) {
  const w = CONFIG.VIRTUAL_WIDTH;
  const h = CONFIG.VIRTUAL_HEIGHT;
  if (!vignetteGradient) {
    vignetteGradient = ctx.createRadialGradient(w / 2, h / 2, h * 0.5, w / 2, h / 2, w * 0.72);
    vignetteGradient.addColorStop(0, 'rgba(0,0,0,0)');
    vignetteGradient.addColorStop(1, 'rgba(0,0,0,0.32)');
  }
  ctx.fillStyle = vignetteGradient;
  ctx.fillRect(0, 0, w, h);
}

function renderPlaying() {
  if (marketCrashActive) {
    ctx.save();
    ctx.translate(marketCrashShakeOffset.x, marketCrashShakeOffset.y);
  }

  // With the 3D layer active, backdrop, billboards and level geometry are
  // already drawn in 3D underneath; only sprites/FX/HUD are drawn here.
  const is3D = !!(world3d && world3d.active);
  const viewLeft = camera.x - 100;
  const viewRight = camera.x + CONFIG.VIRTUAL_WIDTH + 100;

  if (!is3D) {
    // Background (parallax)
    background.render(ctx, camera, CONFIG.VIRTUAL_WIDTH, CONFIG.VIRTUAL_HEIGHT, gameTime);

    // Pit voids (draw dark areas where there's no ground)
    ctx.fillStyle = CONFIG.COLORS.PIT_VOID;
    ctx.fillRect(0, 432 - camera.y, CONFIG.VIRTUAL_WIDTH, CONFIG.VIRTUAL_HEIGHT);

    // Meme billboards (decorative, behind level geometry)
    for (const sign of level.memeSigns) {
      renderMemeSign(ctx, camera, sign, gameTime);
    }

    // Level geometry - only render visible solids
    for (const solid of level.solids) {
      if (solid.x + solid.width > viewLeft && solid.x < viewRight) {
        solid.render(ctx, camera);
      }
    }
  }

  // Moving platforms
  if (!is3D && level.movingPlatforms) {
    for (const mp of level.movingPlatforms) {
      if (mp.x + mp.width > viewLeft && mp.x < viewRight) {
        mp.render(ctx, camera);
      }
    }
  }

  // Checkpoints
  for (const cp of level.checkpoints) {
    cp.render(ctx, camera);
  }

  // Golden Briefcase (goal)
  renderGoldenBriefcase(ctx, camera, level.goalPosition, gameTime);

  // Short Squeeze pads
  for (const pad of level.shortSqueezePads) {
    if (pad.x + pad.width > viewLeft && pad.x < viewRight) {
      pad.render(ctx, camera);
    }
  }

  // Collectibles
  for (const c of level.collectibles) {
    if (c.x + c.width > viewLeft && c.x < viewRight) {
      c.render(ctx, camera);
    }
  }

  // Enemies
  for (const e of level.enemies) {
    if (e.x + e.width > viewLeft && e.x < viewRight) {
      renderEntityShadow(ctx, camera, e);
      e.render(ctx, camera);
    }
  }

  // Boss
  if (level.boss) {
    renderEntityShadow(ctx, camera, level.boss);
    level.boss.render(ctx, camera);
  }

  // Player
  if (!player.deathAnimating && !is3D) {
    renderEntityShadow(ctx, camera, player);
  }
  player.render(ctx, camera);

  // Particles and floating text
  particles.render(ctx, camera);
  floatingText.render(ctx, camera);

  // Flash Crash death effect
  if (flashCrashTimer > 0) {
    ctx.globalAlpha = Math.min(flashCrashTimer * 2, 0.5);
    ctx.fillStyle = '#FF0000';
    ctx.fillRect(0, 0, CONFIG.VIRTUAL_WIDTH, CONFIG.VIRTUAL_HEIGHT);
    ctx.globalAlpha = Math.min(flashCrashTimer * 3, 1);
    ctx.fillStyle = '#FFFFFF';
    ctx.font = 'bold 48px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('FLASH CRASH', CONFIG.VIRTUAL_WIDTH / 2, CONFIG.VIRTUAL_HEIGHT / 2);
    ctx.globalAlpha = 1;
  }

  if (marketCrashActive) {
    ctx.restore();
    // Red tint overlay
    ctx.globalAlpha = 0.15 + Math.sin(marketCrashTimer * 6) * 0.05;
    ctx.fillStyle = '#FF0000';
    ctx.fillRect(0, 0, CONFIG.VIRTUAL_WIDTH, CONFIG.VIRTUAL_HEIGHT);
    ctx.globalAlpha = 1;
  }

  renderVignette(ctx);

  // HUD (screen space)
  hud.render(ctx, player, CONFIG.VIRTUAL_WIDTH);

  // Boss health bar
  if (level.boss && level.boss.activated) {
    hud.renderBossHealth(ctx, CONFIG.VIRTUAL_WIDTH, level.boss);
  }

  // Debug overlay
  if (debugMode) {
    renderDebug();
  }
}

function renderDebug() {

  ctx.strokeStyle = 'lime';

//  Live Stock Ticker (Dow 30)
// ==========================================
// Symbols shown in the live ticker. SPCX (SpaceX) is included so it goes
// live automatically once the feeds list it; until then it's pinned below.
const TICKER_SYMBOLS = ['SPCX','AAPL','MSFT','NVDA','TSLA','AMZN','GOOGL','META',
  'JPM','V','DIS','BA','KO','GS','NFLX','AMD'];

// SpaceX listed on Nasdaq 2026-06-12: closed $160.95, +19% on debut. Used as a
// pin (feeds may lag a brand-new symbol) and as the hardcoded last resort.
const SPCX_FALLBACK = { symbol: 'SPCX', price: 160.95, change: 19.2 };

// Public CORS relays, tried in order. Free stock endpoints don't send CORS
// headers, so the browser needs a proxy; redundancy is what buys reliability.
const CORS_PROXIES = [
  u => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  u => 'https://thingproxy.freeboard.io/fetch/' + u,
];

async function proxiedFetch(url, timeoutMs = 6000) {
  for (const wrap of CORS_PROXIES) {
    try {
      const resp = await fetch(wrap(url), { signal: AbortSignal.timeout(timeoutMs) });
      if (resp.ok) {
        const text = await resp.text();
        if (text && text.length > 2) return text;
      }
    } catch (e) { /* try the next proxy */ }
  }
  throw new Error('all proxies failed for ' + url);
}

function cleanQuote(symbol, price, change) {
  return {
    symbol,
    price: Math.round(price * 100) / 100,
    change: Math.round((change || 0) * 100) / 100,
  };
}

// Source 1 — Yahoo v8 chart (no auth/crumb needed, unlike the old v7 quote).
// One symbol per request, fired in parallel; gives price AND previous close,
// so the % change is accurate. Partial success is fine.
async function fetchFromYahoo(symbols) {
  const settled = await Promise.allSettled(symbols.map(async sym => {
    const text = await proxiedFetch(
      'https://query1.finance.yahoo.com/v8/finance/chart/' + sym + '?interval=1d&range=2d');
    const meta = JSON.parse(text).chart.result[0].meta;
    const price = meta.regularMarketPrice;
    const prev = meta.chartPreviousClose ?? meta.previousClose;
    if (!isFinite(price) || price <= 0) throw new Error('no price for ' + sym);
    return cleanQuote(sym, price, prev ? ((price - prev) / prev) * 100 : 0);
  }));
  return settled.filter(r => r.status === 'fulfilled').map(r => r.value);
}

// Source 2 — Stooq batch CSV (free, no key, all symbols in one request).
// Change here is intraday (close vs open) since the light feed omits prev close.
async function fetchFromStooq(symbols) {
  const list = symbols.map(s => s.toLowerCase() + '.us').join('+');
  const text = await proxiedFetch(
    'https://stooq.com/q/l/?s=' + list + '&f=sd2t2ohlcv&h&e=csv');
  const out = [];
  for (const line of text.trim().split('\n').slice(1)) {
    const [sym, , , open, , , close] = line.split(',');
    const price = parseFloat(close), o = parseFloat(open);
    if (!sym || !isFinite(price) || price <= 0) continue;
    out.push(cleanQuote(sym.replace(/\.us$/i, '').toUpperCase(), price, o ? ((price - o) / o) * 100 : 0));
  }
  return out;
}

async function fetchLiveStockData() {
  const need = Math.ceil(TICKER_SYMBOLS.length / 2); // accept partial coverage
  for (const source of [fetchFromYahoo, fetchFromStooq]) {
    try {
      const quotes = await source(TICKER_SYMBOLS);
      if (quotes.length >= need) {
        if (!quotes.some(q => q.symbol === 'SPCX')) quotes.unshift({ ...SPCX_FALLBACK });
        return quotes;
      }
    } catch (e) {
      console.warn('Live ticker source failed:', e.message);
    }
  }
  return null; // every source failed — fall back to the level's hardcoded list
}

// Try to load live data on page load
fetchLiveStockData().then(stocks => {
  if (stocks && level) {
    level.tickerStocks = stocks;
    if (hud) hud.tickerStocks = stocks;
  }
});

// ==========================================
//  Game Loop
// ==========================================
const FIXED_DT = 1 / 60;
let accumulator = 0;
let lastTime = 0;

function gameLoop(timestamp) {
  if (lastTime === 0) lastTime = timestamp;

  let dt = (timestamp - lastTime) / 1000;
  lastTime = timestamp;

  // Cap delta to prevent spiral of death
  if (dt > 0.1) dt = 0.1;

  accumulator += dt;

  // Fixed timestep physics updates
  while (accumulator >= FIXED_DT) {
    update(FIXED_DT);
    accumulator -= FIXED_DT;
  }

  render();
  requestAnimationFrame(gameLoop);
}

// ==========================================
//  Start!
// ==========================================
requestAnimationFrame(gameLoop);

          for (const e of level.enemies) {
            if (!e.alive) continue;
            const d = Math.abs(e.x - px);
            if (d < 200) { extras.nearEnemy = true; break; }
          }
        }

        // Check nearby collectibles
        if (level.collectibles) {
          for (const c of level.collectibles) {
            if (c.collected || c.type === 'redCandle') continue;
            const d = Math.abs(c.x - px);
            if (d < 150) { extras.nearItem = true; break; }
          }
        }

        // Check nearby pits (simple ground check)
        if (typeof LEVELS_DATA !== 'undefined' || true) {
          // Use the level's solids to detect if there's a gap ahead
          // Simple: check if player is near a pit by checking ground segments
          // We'll keep it simple — just check if player is currently over ground
          extras.nearPit = !player.onGround && player.vy > 0;
        }

        // Get current actions from input (getters cover arrows, WASD, and touch)
        const actionLeft  = input.left;
        const actionRight = input.right;
        const actionJump  = input.jumpHeld;
        const actionDown  = input.down;

        ReplayLib.recordFrame(px, py, idx, extras, actionLeft, actionRight, actionJump, actionDown);
      }

      // Finish recording on level complete or game over
      if ((state === GameState.LEVEL_COMPLETE || state === GameState.GAME_OVER ||
           state === GameState.TITLE) && isRecording) {
        const finalScore = player ? (player.score || 0) : 0;
        const completed = (lastState === GameState.LEVEL_COMPLETE);
        ReplayLib.finishRecording(finalScore, completed);
        isRecording = false;
      }

      lastState = state;
    }

    // Show stats badge
    const stats = ReplayLib.getStats();
    if (stats.replayCount > 0) {
      console.log('%c[HUMAN REC] Replay library: ' + stats.replayCount +
        ' replays, ' + stats.totalFrames + ' frames, best: $' + stats.bestScore,
        'color:#FF69B4');
    }
  }, 100);
})();
  </script>
