  <script>
class BackgroundRenderer {
  constructor(theme) {
    this.theme = theme || 'nightCity';

    if (this.theme === 'nightCity') {
      this._initNightCity();
    } else if (this.theme === 'tradingFloor') {
      this._initTradingFloor();
    } else if (this.theme === 'cryptoMines') {
      this._initCryptoMines();
    } else if (this.theme === 'launchPad') {
      this._initLaunchPad();
    }
  }

  // ==============================
  //  Night City (Level 1) - init
  // ==============================
  _initNightCity() {
    this.layers = [
      this._generateBuildings(15, 0.1, 0.5),
      this._generateBuildings(12, 0.3, 0.7),
      this._generateBuildings(10, 0.5, 0.9),
    ];
    this.stars = [];
    for (let i = 0; i < 80; i++) {
      this.stars.push({
        x: Math.random() * 2000,
        y: Math.random() * 300,
        size: Math.random() * 2 + 0.5,
        twinkle: Math.random() * Math.PI * 2
      });
    }
  }

  _generateBuildings(count, parallax, alpha) {
    const buildings = [];
    let x = -100;
    for (let i = 0; i < count; i++) {
      const w = 60 + Math.random() * 100;
      const h = 120 + Math.random() * 280;
      const windowCols = Math.floor(w / 18);
      const windowRows = Math.floor(h / 18);
      const windows = [];
      for (let r = 0; r < windowRows; r++) {
        for (let c = 0; c < windowCols; c++) {
          windows.push(Math.random() > 0.35);
        }
      }
      buildings.push({
        x: x, w: w, h: h,
        color: [CONFIG.COLORS.BUILDING_1, CONFIG.COLORS.BUILDING_2,
                CONFIG.COLORS.BUILDING_3, CONFIG.COLORS.BUILDING_4][i % 4],
        windowCols: windowCols,
        windowRows: windowRows,
        windows: windows,
        hasAntenna: Math.random() > 0.6,
        antennaHeight: 20 + Math.random() * 30
      });
      x += w + 15 + Math.random() * 40;
    }
    return { buildings: buildings, parallax: parallax, alpha: alpha, totalWidth: x };
  }

  // ==============================
  //  Trading Floor (Level 2) - init
  // ==============================
  _initTradingFloor() {
    this.layers = [
      this._generateTerminals(18, 0.1, 0.4),
      this._generateTerminals(14, 0.3, 0.6),
      this._generateTerminals(10, 0.5, 0.85),
    ];
    // No stars — indoor
    this.stars = [];
  }

  _generateTerminals(count, parallax, alpha) {
    const terminals = [];
    let x = -80;
    for (let i = 0; i < count; i++) {
      const w = 40 + Math.random() * 80;
      const h = 80 + Math.random() * 200;
      const screenCount = Math.floor(h / 30);
      const screens = [];
      for (let s = 0; s < screenCount; s++) {
        screens.push({
          isGreen: Math.random() > 0.4,
          barCount: 3 + Math.floor(Math.random() * 5),
          hasNumber: Math.random() > 0.5,
        });
      }
      terminals.push({
        x: x, w: w, h: h,
        color: ['#2a2018', '#332818', '#2e2418', '#261e14'][i % 4],
        screenCount: screenCount,
        screens: screens,
        isColumn: Math.random() > 0.7,
        columnColor: ['#4a4a5a', '#555565', '#504a5a'][i % 3],
      });
      x += w + 10 + Math.random() * 30;
    }
    return { buildings: terminals, parallax: parallax, alpha: alpha, totalWidth: x };
  }

  // ==============================
  //  Crypto Mines (Level 3) - init
  // ==============================
  _initCryptoMines() {
    this.layers = [
      this._generateServerRacks(18, 0.1, 0.4),
      this._generateServerRacks(14, 0.3, 0.65),
      this._generateServerRacks(10, 0.5, 0.85),
    ];
    // Floating crypto symbols instead of stars
    this.cryptoSymbols = [];
    const symbols = ['BTC', 'ETH', 'DOGE', 'SOL', 'XRP', 'ADA', 'DOT', 'LTC'];
    for (let i = 0; i < 40; i++) {
      this.cryptoSymbols.push({
        x: Math.random() * 2000,
        y: Math.random() * 280,
        symbol: symbols[Math.floor(Math.random() * symbols.length)],
        speed: 5 + Math.random() * 15,
        phase: Math.random() * Math.PI * 2,
        size: 8 + Math.random() * 4,
      });
    }
    // Matrix falling characters
    this.matrixColumns = [];
    for (let i = 0; i < 60; i++) {
      this.matrixColumns.push({
        x: Math.random() * 2000,
        chars: [],
        speed: 30 + Math.random() * 60,
        phase: Math.random() * 500,
        charCount: 5 + Math.floor(Math.random() * 10),
      });
      for (let j = 0; j < this.matrixColumns[i].charCount; j++) {
        this.matrixColumns[i].chars.push(String.fromCharCode(0x30 + Math.floor(Math.random() * 10)));
      }
    }
    // Stalactites from top
    this.stalactites = [];
    for (let i = 0; i < 30; i++) {
      this.stalactites.push({
        x: Math.random() * 2000,
        length: 20 + Math.random() * 60,
        width: 4 + Math.random() * 12,
      });
    }
    this.stars = [];
  }

  _generateServerRacks(count, parallax, alpha) {
    const racks = [];
    let x = -80;
    for (let i = 0; i < count; i++) {
      const w = 30 + Math.random() * 60;
      const h = 100 + Math.random() * 250;
      const ledCount = Math.floor(h / 12);
      const leds = [];
      for (let l = 0; l < ledCount; l++) {
        leds.push({
          color: Math.random() > 0.5 ? '#00FFCC' : '#FF00FF',
          blink: Math.random() > 0.3,
          phase: Math.random() * Math.PI * 2,
        });
      }
      racks.push({
        x: x, w: w, h: h,
        color: ['#0a0a1a', '#0e0e22', '#0c0c1e', '#08081a'][i % 4],
        ledCount: ledCount,
        leds: leds,
        hasNode: Math.random() > 0.6,
        nodeColor: Math.random() > 0.5 ? '#00CCFF' : '#AA44FF',
      });
      x += w + 8 + Math.random() * 25;
    }
    return { buildings: racks, parallax: parallax, alpha: alpha, totalWidth: x };
  }

  // ==============================
  //  Main render dispatcher
  // ==============================
  render(ctx, camera, canvasWidth, canvasHeight, time) {
    if (this.theme === 'nightCity') {
      this._renderNightCity(ctx, camera, canvasWidth, canvasHeight, time);
    } else if (this.theme === 'tradingFloor') {
      this._renderTradingFloor(ctx, camera, canvasWidth, canvasHeight, time);
    } else if (this.theme === 'cryptoMines') {
      this._renderCryptoMines(ctx, camera, canvasWidth, canvasHeight, time);
    } else if (this.theme === 'launchPad') {
      this._renderLaunchPad(ctx, camera, canvasWidth, canvasHeight, time);
    }
  }

  // ==============================
  //  Launch Pad (SpaceX IPO level)
  // ==============================
  _initLaunchPad() {
    this.layers = [];
    // Star field
    this.stars = [];
    for (let i = 0; i < 110; i++) {
      this.stars.push({
        x: Math.random() * 2200,
        y: Math.random() * 340,
        size: Math.random() * 2 + 0.5,
        twinkle: Math.random() * Math.PI * 2
      });
    }
    // Rockets launching on repeating cycles. Each has a horizontal world
    // position (wrapped with parallax), a launch period, and a size.
    this.rockets = [];
    for (let i = 0; i < 14; i++) {
      this.rockets.push({
        x: 80 + i * 150 + Math.random() * 100,
        size: 0.55 + Math.random() * 0.9,          // scale factor
        period: 6 + Math.random() * 6,             // seconds per launch cycle
        offset: Math.random() * 12,                // cycle phase offset
        parallax: 0.15 + Math.random() * 0.3,
        tint: Math.random() > 0.7 ? '#D8E8FF' : '#ECECF4'
      });
    }
    // Launch gantry towers (two parallax layers)
    this.towers = [];
    for (let i = 0; i < 14; i++) {
      this.towers.push({
        x: i * 160 + Math.random() * 60,
        w: 22 + Math.random() * 16,
        h: 120 + Math.random() * 160,
        parallax: i % 2 === 0 ? 0.3 : 0.5,
        alpha: i % 2 === 0 ? 0.5 : 0.8,
        hasDish: Math.random() > 0.6
      });
    }
  }

  _renderLaunchPad(ctx, camera, canvasWidth, canvasHeight, time) {
    // Deep-space gradient with a purple horizon
    const grad = ctx.createLinearGradient(0, 0, 0, canvasHeight);
    grad.addColorStop(0, '#020210');
    grad.addColorStop(0.55, '#0a0a2a');
    grad.addColorStop(1, '#251238');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvasWidth, canvasHeight);

    // Stars
    for (const star of this.stars) {
      const sx = ((star.x - camera.x * 0.03) % (canvasWidth + 100));
      ctx.globalAlpha = (Math.sin(time * 2 + star.twinkle) * 0.3 + 0.7) * 0.85;
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(sx, star.y, star.size, star.size);
    }
    ctx.globalAlpha = 1;

    // Mars on the horizon (where we're all going, obviously)
    const marsX = canvasWidth * 0.78 - camera.x * 0.015;
    ctx.fillStyle = '#C1440E';
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.arc(marsX, 80, 26, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#8C2F08';
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.arc(marsX - 8, 72, 7, 0, Math.PI * 2);
    ctx.arc(marsX + 10, 88, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 0.15;
    ctx.fillStyle = '#FF6633';
    ctx.beginPath();
    ctx.arc(marsX, 80, 38, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // Rockets mid-launch (behind the towers)
    for (const r of this.rockets) {
      const repeatW = 2200;
      let rx = ((r.x - camera.x * r.parallax) % repeatW);
      if (rx < -100) rx += repeatW;
      if (rx > canvasWidth + 100) continue;

      // Cycle: 0..0.15 sitting on pad, 0.15..1 ascending off the top.
      // Exponent 1.6 keeps rockets visible mid-screen longer than a pure
      // quadratic while still accelerating away convincingly.
      const phase = ((time + r.offset) % r.period) / r.period;
      const ascent = Math.max(0, (phase - 0.15) / 0.85);
      const ry = canvasHeight - 60 - Math.pow(ascent, 1.6) * (canvasHeight + 260);
      if (ry < -140) continue;

      const s = r.size;
      ctx.save();
      ctx.translate(rx, ry);
      ctx.scale(s, s);
      // Exhaust flame + smoke once launched
      if (ascent > 0) {
        const flick = Math.abs(Math.sin(time * 30 + r.offset)) * 14;
        ctx.fillStyle = '#FFA500';
        ctx.beginPath();
        ctx.moveTo(-7, 48);
        ctx.lineTo(0, 78 + flick);
        ctx.lineTo(7, 48);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#FFE066';
        ctx.beginPath();
        ctx.moveTo(-4, 48);
        ctx.lineTo(0, 64 + flick * 0.6);
        ctx.lineTo(4, 48);
        ctx.closePath();
        ctx.fill();
        // Smoke puffs trailing below
        ctx.fillStyle = 'rgba(200, 200, 220, 0.18)';
        for (let p = 1; p <= 3; p++) {
          ctx.beginPath();
          ctx.arc((Math.sin(time * 4 + p * 2.1) * 6), 80 + p * 26, 10 + p * 5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      // Body
      ctx.fillStyle = r.tint;
      ctx.fillRect(-7, 0, 14, 48);
      // Nose cone
      ctx.fillStyle = '#FF4444';
      ctx.beginPath();
      ctx.moveTo(-7, 0);
      ctx.lineTo(0, -16);
      ctx.lineTo(7, 0);
      ctx.closePath();
      ctx.fill();
      // Fins
      ctx.fillStyle = '#FF4444';
      ctx.beginPath();
      ctx.moveTo(-7, 48);
      ctx.lineTo(-13, 56);
      ctx.lineTo(-7, 38);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(7, 48);
      ctx.lineTo(13, 56);
      ctx.lineTo(7, 38);
      ctx.closePath();
      ctx.fill();
      // Porthole
      ctx.fillStyle = '#4488FF';
      ctx.beginPath();
      ctx.arc(0, 14, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Launch gantry towers (silhouettes with blinking pad lights)
    for (const t of this.towers) {
      const repeatW = 2300;
      let tx = ((t.x - camera.x * t.parallax) % repeatW);
      if (tx < -100) tx += repeatW;
      if (tx > canvasWidth + 100) continue;
      const ty = canvasHeight - t.h;

      ctx.globalAlpha = t.alpha;
      ctx.fillStyle = '#101025';
      ctx.fillRect(tx, ty, t.w, t.h);
      // Cross bracing
      ctx.strokeStyle = '#1c1c38';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let yy = ty; yy < canvasHeight - 20; yy += 26) {
        ctx.moveTo(tx, yy);
        ctx.lineTo(tx + t.w, yy + 26);
        ctx.moveTo(tx + t.w, yy);
        ctx.lineTo(tx, yy + 26);
      }
      ctx.stroke();
      // Dish or beacon on top
      if (t.hasDish) {
        ctx.fillStyle = '#181830';
        ctx.beginPath();
        ctx.arc(tx + t.w / 2, ty - 6, 9, Math.PI, Math.PI * 2);
        ctx.fill();
      }
      if (Math.sin(time * 3 + t.x) > 0.4) {
        ctx.fillStyle = '#FF3333';
        ctx.beginPath();
        ctx.arc(tx + t.w / 2, ty - (t.hasDish ? 16 : 3), 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // Launch pad lights along the ground line
    ctx.fillStyle = '#FFD700';
    for (let i = 0; i < 24; i++) {
      const lx = ((i * 90 - camera.x * 0.6) % (canvasWidth + 180));
      const blink = Math.sin(time * 5 + i * 1.3) > -0.3;
      if (blink && lx > -10) {
        ctx.globalAlpha = 0.7;
        ctx.fillRect(lx, canvasHeight - 8, 4, 4);
      }
    }
    ctx.globalAlpha = 1;
  }

  // ==============================
  //  Night City rendering
  // ==============================
  _renderNightCity(ctx, camera, canvasWidth, canvasHeight, time) {
    // Sky gradient
    const grad = ctx.createLinearGradient(0, 0, 0, canvasHeight);
    grad.addColorStop(0, CONFIG.COLORS.SKY_TOP);
    grad.addColorStop(0.5, CONFIG.COLORS.SKY_MID);
    grad.addColorStop(1, CONFIG.COLORS.SKY_BOTTOM);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvasWidth, canvasHeight);

    // Moon
    ctx.fillStyle = '#FFFFEE';
    ctx.globalAlpha = 0.8;
    ctx.beginPath();
    ctx.arc(canvasWidth * 0.82 - camera.x * 0.02, 60, 30, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 0.2;
    ctx.beginPath();
    ctx.arc(canvasWidth * 0.82 - camera.x * 0.02, 60, 45, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // Stars
    for (const star of this.stars) {
      const sx = ((star.x - camera.x * 0.03) % (canvasWidth + 100));
      const twinkle = Math.sin(time * 2 + star.twinkle) * 0.3 + 0.7;
      ctx.globalAlpha = twinkle * 0.8;
      ctx.fillStyle = CONFIG.COLORS.WHITE;
      ctx.fillRect(sx, star.y, star.size, star.size);
    }
    ctx.globalAlpha = 1;

    // Building layers
    for (const layer of this.layers) {
      this._renderBuildingLayer(ctx, camera, canvasWidth, canvasHeight, layer, time);
    }
  }

  _renderBuildingLayer(ctx, camera, canvasWidth, canvasHeight, layer, time) {
    ctx.globalAlpha = layer.alpha;
    const offsetX = camera.x * layer.parallax;

    for (const b of layer.buildings) {
      const repeatW = layer.totalWidth;
      let drawX = ((b.x - offsetX) % repeatW);
      if (drawX > canvasWidth + 200) drawX -= repeatW;
      if (drawX + b.w < -200) drawX += repeatW;
      if (drawX > canvasWidth + 200) continue;
      if (drawX + b.w < -200) continue;

      const by = canvasHeight - b.h;

      ctx.fillStyle = b.color;
      ctx.fillRect(drawX, by, b.w, b.h);

      ctx.fillStyle = 'rgba(255,255,255,0.05)';
      ctx.fillRect(drawX, by, b.w, 3);

      if (b.hasAntenna) {
        ctx.fillStyle = '#555';
        ctx.fillRect(drawX + b.w / 2 - 1, by - b.antennaHeight, 3, b.antennaHeight);
        const blink = Math.sin(time * 3 + b.x) > 0.5;
        if (blink) {
          ctx.fillStyle = '#FF0000';
          ctx.beginPath();
          ctx.arc(drawX + b.w / 2, by - b.antennaHeight, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      const wSize = 8;
      const wGap = 14;
      const startX = drawX + 8;
      const startY = by + 12;
      for (let r = 0; r < b.windowRows; r++) {
        for (let c = 0; c < b.windowCols; c++) {
          const idx = r * b.windowCols + c;
          const lit = b.windows[idx];
          if (lit) {
            const flicker = Math.sin(time * 0.5 + idx * 7.3) > -0.95;
            ctx.fillStyle = flicker ?
              (idx % 3 === 0 ? CONFIG.COLORS.WINDOW_LIT_2 : CONFIG.COLORS.WINDOW_LIT) :
              CONFIG.COLORS.WINDOW_DARK;
          } else {
            ctx.fillStyle = CONFIG.COLORS.WINDOW_DARK;
          }
          ctx.fillRect(startX + c * wGap, startY + r * wGap, wSize, wSize);
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  // ==============================
  //  Trading Floor rendering
  // ==============================
  _renderTradingFloor(ctx, camera, canvasWidth, canvasHeight, time) {
    // Warm amber sky gradient (indoor ceiling)
    const grad = ctx.createLinearGradient(0, 0, 0, canvasHeight);
    grad.addColorStop(0, '#2a1a00');
    grad.addColorStop(0.5, '#3a2a10');
    grad.addColorStop(1, '#4a3a20');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvasWidth, canvasHeight);

    // Warm ambient glow from ceiling
    ctx.globalAlpha = 0.15;
    const ceilGrad = ctx.createLinearGradient(0, 0, 0, canvasHeight * 0.4);
    ceilGrad.addColorStop(0, '#FF8800');
    ceilGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = ceilGrad;
    ctx.fillRect(0, 0, canvasWidth, canvasHeight * 0.4);
    ctx.globalAlpha = 1;

    // Ceiling light fixtures
    for (let i = 0; i < 6; i++) {
      const lx = ((i * 180 - camera.x * 0.05) % (canvasWidth + 200));
      const pulse = 0.3 + Math.sin(time * 1.5 + i * 1.7) * 0.1;
      ctx.globalAlpha = pulse;
      ctx.fillStyle = '#FFAA44';
      ctx.fillRect(lx, 0, 60, 4);
      // Light cone
      ctx.beginPath();
      ctx.moveTo(lx, 4);
      ctx.lineTo(lx - 20, 80);
      ctx.lineTo(lx + 80, 80);
      ctx.lineTo(lx + 60, 4);
      ctx.closePath();
      ctx.fillStyle = 'rgba(255,170,68,0.04)';
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Terminal/column layers
    for (const layer of this.layers) {
      this._renderTerminalLayer(ctx, camera, canvasWidth, canvasHeight, layer, time);
    }
  }

  _renderTerminalLayer(ctx, camera, canvasWidth, canvasHeight, layer, time) {
    ctx.globalAlpha = layer.alpha;
    const offsetX = camera.x * layer.parallax;

    for (const t of layer.buildings) {
      const repeatW = layer.totalWidth;
      let drawX = ((t.x - offsetX) % repeatW);
      if (drawX > canvasWidth + 200) drawX -= repeatW;
      if (drawX + t.w < -200) drawX += repeatW;
      if (drawX > canvasWidth + 200) continue;
      if (drawX + t.w < -200) continue;

      const by = canvasHeight - t.h;

      if (t.isColumn) {
        // Stone column
        ctx.fillStyle = t.columnColor;
        ctx.fillRect(drawX + t.w * 0.2, by, t.w * 0.6, t.h);
        // Column cap
        ctx.fillStyle = '#6a6a7a';
        ctx.fillRect(drawX, by, t.w, 6);
        ctx.fillRect(drawX + 2, by + 6, t.w - 4, 4);
      } else {
        // Terminal desk body
        ctx.fillStyle = t.color;
        ctx.fillRect(drawX, by, t.w, t.h);

        // Top edge
        ctx.fillStyle = 'rgba(255,200,100,0.08)';
        ctx.fillRect(drawX, by, t.w, 3);

        // Screens on terminals
        const screenH = 18;
        const screenGap = 26;
        for (let s = 0; s < t.screenCount; s++) {
          const sy = by + 10 + s * screenGap;
          if (sy + screenH > canvasHeight) break;
          const screen = t.screens[s];

          // Screen background
          ctx.fillStyle = '#0a1a0a';
          ctx.fillRect(drawX + 4, sy, t.w - 8, screenH);

          // Stock chart bars
          const barW = Math.max(2, (t.w - 16) / screen.barCount);
          for (let b = 0; b < screen.barCount; b++) {
            const barH = 4 + Math.abs(Math.sin(time * 0.8 + s * 3 + b * 2.1)) * (screenH - 6);
            const isGreen = Math.sin(time * 0.3 + s + b * 1.7) > 0;
            ctx.fillStyle = isGreen ? '#00CC66' : '#CC3333';
            ctx.fillRect(drawX + 6 + b * barW, sy + screenH - barH - 1, barW - 1, barH);
          }

          // Screen glow edge
          ctx.strokeStyle = screen.isGreen ? 'rgba(0,204,102,0.2)' : 'rgba(204,51,51,0.2)';
          ctx.lineWidth = 1;
          ctx.strokeRect(drawX + 4, sy, t.w - 8, screenH);
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  // ==============================
  //  Crypto Mines rendering
  // ==============================
  _renderCryptoMines(ctx, camera, canvasWidth, canvasHeight, time) {
    // Deep purple underground gradient
    const grad = ctx.createLinearGradient(0, 0, 0, canvasHeight);
    grad.addColorStop(0, '#0a0020');
    grad.addColorStop(0.5, '#150030');
    grad.addColorStop(1, '#0a0a2a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvasWidth, canvasHeight);

    // Matrix falling characters (far background)
    ctx.font = '10px monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    for (const col of this.matrixColumns) {
      const mx = ((col.x - camera.x * 0.05) % (canvasWidth + 100));
      for (let j = 0; j < col.charCount; j++) {
        const my = ((col.phase + time * col.speed + j * 14) % (canvasHeight + 50)) - 20;
        const fade = j === 0 ? 0.5 : 0.12 + (col.charCount - j) / col.charCount * 0.15;
        ctx.globalAlpha = fade;
        ctx.fillStyle = j === 0 ? '#44FF88' : '#00AA44';
        ctx.fillText(col.chars[j], mx, my);
      }
    }
    ctx.globalAlpha = 1;

    // Stalactites from ceiling
    for (const stal of this.stalactites) {
      const sx = ((stal.x - camera.x * 0.08) % (canvasWidth + 200));
      ctx.fillStyle = '#1a1040';
      ctx.beginPath();
      ctx.moveTo(sx - stal.width / 2, 0);
      ctx.lineTo(sx + stal.width / 2, 0);
      ctx.lineTo(sx, stal.length);
      ctx.closePath();
      ctx.fill();
      // Glow tip
      ctx.globalAlpha = 0.3;
      ctx.fillStyle = '#6622AA';
      ctx.beginPath();
      ctx.arc(sx, stal.length, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // Floating crypto symbols
    ctx.font = 'bold 9px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const cs of this.cryptoSymbols) {
      const cx = ((cs.x - camera.x * 0.04) % (canvasWidth + 100));
      const cy = cs.y + Math.sin(time * 0.5 + cs.phase) * 10;
      const pulse = 0.15 + Math.sin(time * 1.5 + cs.phase) * 0.1;
      ctx.globalAlpha = pulse;
      ctx.fillStyle = cs.symbol === 'BTC' ? '#FF9900' :
                      cs.symbol === 'ETH' ? '#627EEA' :
                      cs.symbol === 'DOGE' ? '#C3A634' :
                      '#00CCFF';
      ctx.fillText(cs.symbol, cx, cy);
    }
    ctx.globalAlpha = 1;

    // Server rack layers
    for (const layer of this.layers) {
      this._renderServerLayer(ctx, camera, canvasWidth, canvasHeight, layer, time);
    }
  }

  _renderServerLayer(ctx, camera, canvasWidth, canvasHeight, layer, time) {
    ctx.globalAlpha = layer.alpha;
    const offsetX = camera.x * layer.parallax;

    for (const r of layer.buildings) {
      const repeatW = layer.totalWidth;
      let drawX = ((r.x - offsetX) % repeatW);
      if (drawX > canvasWidth + 200) drawX -= repeatW;
      if (drawX + r.w < -200) drawX += repeatW;
      if (drawX > canvasWidth + 200) continue;
      if (drawX + r.w < -200) continue;

      const by = canvasHeight - r.h;

      // Server rack body
      ctx.fillStyle = r.color;
      ctx.fillRect(drawX, by, r.w, r.h);

      // Top edge with neon glow
      ctx.fillStyle = 'rgba(0,200,255,0.1)';
      ctx.fillRect(drawX, by, r.w, 2);

      // Side glow
      ctx.fillStyle = 'rgba(170,68,255,0.05)';
      ctx.fillRect(drawX - 1, by, 2, r.h);
      ctx.fillRect(drawX + r.w - 1, by, 2, r.h);

      // LED strips
      const ledGap = 10;
      for (let l = 0; l < r.ledCount; l++) {
        const ly = by + 6 + l * ledGap;
        if (ly > canvasHeight) break;
        const led = r.leds[l];
        if (led.blink && Math.sin(time * 3 + led.phase) < 0) continue;
        ctx.fillStyle = led.color;
        ctx.globalAlpha = layer.alpha * 0.8;
        ctx.fillRect(drawX + 4, ly, 3, 2);
        ctx.fillRect(drawX + r.w - 7, ly, 3, 2);
        // LED glow
        ctx.globalAlpha = layer.alpha * 0.15;
        ctx.fillRect(drawX + 2, ly - 1, 7, 4);
      }
      ctx.globalAlpha = layer.alpha;

      // Blockchain node indicator
      if (r.hasNode) {
        const nx = drawX + r.w / 2;
        const ny = by + 20;
        ctx.globalAlpha = layer.alpha * (0.4 + Math.sin(time * 2 + r.x) * 0.2);
        ctx.strokeStyle = r.nodeColor;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(nx, ny, 6, 0, Math.PI * 2);
        ctx.stroke();
        // Inner dot
        ctx.fillStyle = r.nodeColor;
        ctx.beginPath();
        ctx.arc(nx, ny, 2, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }
}

function renderGoldenBriefcase(ctx, camera, pos, time) {
  const sx = pos.x - camera.x;
  const sy = pos.y - camera.y;

  // Glow pulse
  const glowSize = 40 + Math.sin(time * 3) * 8;
  ctx.globalAlpha = 0.2 + Math.sin(time * 3) * 0.1;
  ctx.fillStyle = CONFIG.COLORS.BULL_GOLD;
  ctx.beginPath();
  ctx.arc(sx + 24, sy + 20, glowSize, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;

  // Rays of light
  ctx.strokeStyle = 'rgba(255,215,0,0.3)';
  ctx.lineWidth = 2;
  for (let i = 0; i < 8; i++) {
    const angle = time * 0.5 + i * Math.PI / 4;
    const innerR = 30;
    const outerR = 50 + Math.sin(time * 2 + i) * 10;
    ctx.beginPath();
    ctx.moveTo(sx + 24 + Math.cos(angle) * innerR, sy + 20 + Math.sin(angle) * innerR);
    ctx.lineTo(sx + 24 + Math.cos(angle) * outerR, sy + 20 + Math.sin(angle) * outerR);
    ctx.stroke();
  }

  // Briefcase body
  ctx.fillStyle = CONFIG.COLORS.BULL_GOLD;
  ctx.fillRect(sx + 2, sy + 10, 44, 28);

  // Briefcase top edge
  ctx.fillStyle = '#FFE44D';
  ctx.fillRect(sx + 2, sy + 10, 44, 4);

  // Handle
  ctx.strokeStyle = '#B8860B';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(sx + 24, sy + 10, 10, Math.PI, 0);
  ctx.stroke();

  // Clasp
  ctx.fillStyle = CONFIG.COLORS.WHITE;
  ctx.fillRect(sx + 20, sy + 24, 8, 4);

  // Dollar sign
  ctx.fillStyle = '#B8860B';
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('$', sx + 24, sy + 28);

  // Floating sparkles
  for (let i = 0; i < 4; i++) {
    const angle = time * 1.5 + i * Math.PI / 2;
    const dist = 35;
    const px = sx + 24 + Math.cos(angle) * dist;
    const py = sy + 20 + Math.sin(angle) * dist * 0.7;
    ctx.globalAlpha = 0.5 + Math.sin(time * 4 + i) * 0.3;
    ctx.fillStyle = CONFIG.COLORS.WHITE;
    // Star shape
    ctx.beginPath();
    ctx.moveTo(px, py - 3);
    ctx.lineTo(px + 1, py - 1);
    ctx.lineTo(px + 3, py);
    ctx.lineTo(px + 1, py + 1);
    ctx.lineTo(px, py + 3);
    ctx.lineTo(px - 1, py + 1);
    ctx.lineTo(px - 3, py);
    ctx.lineTo(px - 1, py - 1);
    ctx.closePath();
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

  <script>
class AudioManager {
  constructor() {
    this.ctx = null;
    this.enabled = true;
    this.muted = false;
    try { this.muted = localStorage.getItem('bullrun_muted') === '1'; } catch (e) { /* storage blocked */ }
    this.initialized = false;
    this.bgMusicPlaying = false;
    this._bgMusicTimeout = null;
    this.bgMusicGain = null;
  }

  init() {
    if (this.initialized) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.masterGain = this.ctx.createGain();
      this.masterGain.gain.value = this.muted ? 0 : 1;
      this.masterGain.connect(this.ctx.destination);
      this.initialized = true;
    } catch (e) {
      this.enabled = false;
    }
  }

  toggleMute() {
    this.muted = !this.muted;
    try { localStorage.setItem('bullrun_muted', this.muted ? '1' : '0'); } catch (e) { /* storage blocked */ }
    if (this.masterGain) this.masterGain.gain.value = this.muted ? 0 : 1;
  }

  _playTone(frequency, duration, type, volume, delay) {
    if (!this.ctx || !this.enabled) return;
    type = type || 'square';
    volume = volume || 0.12;
    delay = delay || 0;

    const startTime = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(frequency, startTime);
    gain.gain.setValueAtTime(volume, startTime);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
    osc.connect(gain);
    gain.connect(this.masterGain);
    osc.start(startTime);
    osc.stop(startTime + duration);
  }

  playJump() {
    this._playTone(350, 0.08, 'square', 0.1);
    this._playTone(520, 0.1, 'square', 0.08, 0.04);
  }

  playCollect() {
    this._playTone(880, 0.06, 'sine', 0.12);
    this._playTone(1320, 0.1, 'sine', 0.08, 0.05);
  }

  playStomp() {
    this._playTone(180, 0.12, 'sawtooth', 0.15);
    this._playTone(90, 0.15, 'square', 0.08, 0.05);
  }

  playDamage() {
    this._playTone(200, 0.2, 'sawtooth', 0.15);
    this._playTone(120, 0.25, 'sawtooth', 0.1, 0.08);
  }

  playDeath() {
    const notes = [400, 350, 300, 250, 200, 150, 100];
    notes.forEach((freq, i) => {
      this._playTone(freq, 0.18, 'square', 0.12, i * 0.1);
    });
  }

  playPowerUp() {
    const notes = [400, 500, 600, 700, 800, 1000, 1200];
    notes.forEach((freq, i) => {
      this._playTone(freq, 0.08, 'sine', 0.1, i * 0.05);
    });
  }

  playCheckpoint() {
    const notes = [523, 659, 784];
    notes.forEach((freq, i) => {
      this._playTone(freq, 0.12, 'triangle', 0.12, i * 0.08);
    });
  }

  playExtraLife() {
    const notes = [523, 659, 784, 1047, 784, 1047];
    notes.forEach((freq, i) => {
      this._playTone(freq, 0.15, 'sine', 0.12, i * 0.1);
    });
  }

  playLevelComplete() {
    const notes = [523, 587, 659, 784, 880, 1047];
    notes.forEach((freq, i) => {
      this._playTone(freq, 0.25, 'sine', 0.12, i * 0.12);
    });
    // Triumphant chord
    this._playTone(523, 0.5, 'sine', 0.06, 0.8);
    this._playTone(659, 0.5, 'sine', 0.06, 0.8);
    this._playTone(784, 0.5, 'sine', 0.06, 0.8);
    this._playTone(1047, 0.5, 'sine', 0.06, 0.8);
  }

  playBlockHit() {
    this._playTone(600, 0.06, 'square', 0.08);
    this._playTone(800, 0.06, 'square', 0.06, 0.03);
  }

  playHodl() {
    this._playTone(440, 0.3, 'sine', 0.08);
    this._playTone(550, 0.3, 'sine', 0.06, 0.15);
    this._playTone(660, 0.4, 'sine', 0.08, 0.3);
  }

  playSuperJump() {
    this._playTone(300, 0.06, 'square', 0.1);
    this._playTone(500, 0.06, 'square', 0.08, 0.03);
    this._playTone(700, 0.08, 'square', 0.08, 0.06);
    this._playTone(900, 0.12, 'sine', 0.1, 0.09);
  }

  playMarginCall() {
    this._playTone(300, 0.15, 'sawtooth', 0.12);
    this._playTone(200, 0.2, 'sawtooth', 0.15, 0.1);
    this._playTone(100, 0.4, 'sawtooth', 0.12, 0.2);
  }

  playClang() {
    this._playTone(800, 0.05, 'square', 0.15);
    this._playTone(600, 0.08, 'triangle', 0.12, 0.03);
    this._playTone(400, 0.1, 'triangle', 0.08, 0.06);
  }

  playDiamondHands() {
    const notes = [523, 659, 784, 1047, 1319, 1568];
    notes.forEach((freq, i) => {
      this._playTone(freq, 0.12, 'sine', 0.12, i * 0.06);
    });
    this._playTone(523, 0.6, 'sine', 0.06, 0.4);
    this._playTone(784, 0.6, 'sine', 0.06, 0.4);
    this._playTone(1047, 0.6, 'sine', 0.06, 0.4);
  }

  // Accelerating tick sound during diamond hands — called from main update loop
  playDiamondHandsTick(remainingRatio) {
    // remainingRatio: 1 = just started, 0 = about to end
    // Pitch rises and volume increases as time runs out
    const baseFreq = 600 + (1 - remainingRatio) * 800;  // 600 → 1400 Hz
    const vol = 0.06 + (1 - remainingRatio) * 0.08;     // 0.06 → 0.14
    this._playTone(baseFreq, 0.04, 'sine', vol);
    this._playTone(baseFreq * 1.5, 0.025, 'sine', vol * 0.5, 0.015);
  }

  playDiamondCollect() {
    // Sparkly catch sound for the running diamond
    const notes = [1047, 1319, 1568, 2093];
    notes.forEach((freq, i) => {
      this._playTone(freq, 0.1, 'sine', 0.12, i * 0.04);
    });
  }

  playGrizzlyStomp() {
    // Heavy impact — deeper than normal stomp
    this._playTone(120, 0.15, 'sawtooth', 0.18);
    this._playTone(80, 0.2, 'square', 0.15, 0.05);
    this._playTone(200, 0.1, 'triangle', 0.1, 0.1);
    this._playTone(60, 0.3, 'sawtooth', 0.1, 0.15);
  }

  playMarketCrash() {
    // Alarm siren — rising and falling tones
    this._playTone(400, 0.3, 'sawtooth', 0.15);
    this._playTone(600, 0.3, 'sawtooth', 0.15, 0.3);
    this._playTone(400, 0.3, 'sawtooth', 0.15, 0.6);
    this._playTone(600, 0.3, 'sawtooth', 0.12, 0.9);
    this._playTone(300, 0.5, 'square', 0.1, 1.2);
  }

  playDividend() {
    this._playTone(1200, 0.06, 'sine', 0.12);
    this._playTone(1600, 0.06, 'sine', 0.1, 0.04);
    this._playTone(2000, 0.1, 'sine', 0.08, 0.08);
    this._playTone(1600, 0.15, 'triangle', 0.06, 0.12);
  }

  playBossRoar() {
    this._playTone(80, 0.5, 'sawtooth', 0.2);
    this._playTone(60, 0.6, 'sawtooth', 0.18, 0.1);
    this._playTone(100, 0.3, 'square', 0.12, 0.3);
  }

  playBossShockwave() {
    this._playTone(100, 0.3, 'sawtooth', 0.15);
    this._playTone(60, 0.4, 'square', 0.12, 0.1);
  }

  playBossDeath() {
    const notes = [523, 659, 784, 1047, 1319, 1568, 2093];
    notes.forEach((freq, i) => {
      this._playTone(freq, 0.15, 'sine', 0.15, i * 0.08);
    });
    this._playTone(523, 1.0, 'sine', 0.08, 0.6);
    this._playTone(784, 1.0, 'sine', 0.08, 0.6);
    this._playTone(1047, 1.0, 'sine', 0.08, 0.6);
    this._playTone(1568, 1.0, 'sine', 0.06, 0.6);
  }

  playBackgroundMusic() {
    if (!this.ctx || this.bgMusicPlaying) return;
    this.bgMusicPlaying = true;

    const ctx = this.ctx;
    const musicGain = ctx.createGain();
    musicGain.gain.value = 0.08;
    musicGain.connect(this.masterGain);
    this.bgMusicGain = musicGain;

    // Tempo: 150 BPM, eighth note ≈ 0.2s
    const BPM = 150;
    const eighth = 60 / BPM / 2;

    // Note frequencies — _ = rest
    const _ = 0;
    const C3=131,D3=147,E3=165,F3=175,G3=196,A3=220,B3=247;
    const C4=262,D4=294,E4=330,F4=349,G4=392,A4=440,B4=494;
    const C5=523,D5=587,E5=659,F5=698,G5=784,A5=880,B5=988;
    const C6=1047,D6=1175;

    // ========== 32-BAR COMPOSITION ==========
    // 8 eighth notes per bar · 256 total notes · ~51 seconds
    // Structure: Intro(4) → Theme A(8) → Theme B(8) → Bridge(4) → Theme A'(8)

    // ---- MELODY (square lead) ----
    const melody = [
      // INTRO (4 bars) — gentle build
      C5,_,E5,_,G5,_,_,_,   E5,_,D5,_,C5,_,_,_,
      C5,D5,E5,G5,E5,D5,C5,D5,  E5,_,G5,_,_,_,_,_,

      // THEME A (8 bars) — "Bull Run" hook
      G5,_,E5,G5,C6,_,G5,_,   A5,G5,E5,C5,D5,_,E5,_,
      G5,_,E5,G5,C6,_,G5,A5,   B5,_,G5,_,D5,_,_,_,
      G5,_,E5,G5,C6,_,G5,_,   A5,G5,E5,C5,D5,E5,G5,A5,
      F5,_,E5,_,D5,_,C5,D5,   E5,_,_,_,_,_,_,_,

      // THEME B (8 bars) — funky, driving
      A5,_,E5,_,A5,G5,E5,_,   F5,_,C5,_,F5,E5,C5,_,
      G5,E5,G5,A5,B5,_,A5,G5,   E5,_,D5,_,_,_,_,_,
      A5,E5,C5,E5,A5,_,G5,E5,   F5,C5,A4,C5,F5,_,E5,C5,
      D5,E5,F5,G5,A5,B5,C6,D6,   C6,_,_,_,B5,_,_,_,

      // BRIDGE (4 bars) — lyrical, breathing room
      F5,_,A5,C6,_,A5,F5,_,   G5,_,B5,D5,_,_,G5,_,
      E5,G5,B5,G5,E5,B4,E5,G5,   A5,_,E5,C5,_,_,_,_,

      // THEME A' (8 bars) — triumphant return
      G5,_,E5,G5,C6,_,G5,E5,   A5,G5,E5,C5,D5,_,E5,G5,
      C6,_,G5,_,E5,_,G5,A5,   B5,_,D6,_,B5,_,G5,_,
      C6,G5,E5,G5,C6,_,E5,G5,   A5,G5,E5,C5,F5,A5,C6,A5,
      G5,B5,D6,B5,G5,D5,B4,D5,   C5,E5,G5,C6,_,_,_,_,
    ];

    // ---- BASS (triangle — bouncy, every other eighth) ----
    const bassLine = [
      // Intro: C | C | C | C
      C3,_,C3,_,G3,_,C3,_,  C3,_,C3,_,G3,_,C3,_,
      C3,_,C3,_,G3,_,C3,_,  C3,_,G3,_,C3,_,_,_,
      // Theme A: C | Am | C | G  |  C | Am | F | C
      C3,_,G3,_,C3,_,G3,_,  A3,_,E3,_,A3,_,E3,_,
      C3,_,G3,_,C3,_,G3,_,  G3,_,D3,_,G3,_,D3,_,
      C3,_,G3,_,C3,_,G3,_,  A3,_,E3,_,A3,_,E3,_,
      F3,_,C3,_,F3,_,C3,_,  C3,_,G3,_,C3,_,_,_,
      // Theme B: Am | F | G | Em  |  Am | F | Dm | C
      A3,_,E3,_,A3,_,E3,_,  F3,_,C3,_,F3,_,C3,_,
      G3,_,D3,_,G3,_,D3,_,  E3,_,B3,_,E3,_,_,_,
      A3,_,E3,_,A3,_,E3,_,  F3,_,C3,_,F3,_,C3,_,
      D3,_,A3,_,D3,_,A3,_,  C3,_,G3,_,C3,_,_,_,
      // Bridge: F | G | Em | Am
      F3,_,C3,_,F3,_,C3,_,  G3,_,D3,_,G3,_,D3,_,
      E3,_,B3,_,E3,_,B3,_,  A3,_,E3,_,A3,_,_,_,
      // Theme A': C | Am | C | G  |  C | F | G | C
      C3,_,G3,_,C3,_,G3,_,  A3,_,E3,_,A3,_,E3,_,
      C3,_,G3,_,C3,_,G3,_,  G3,_,D3,_,G3,_,D3,_,
      C3,_,G3,_,C3,_,G3,_,  F3,_,C3,_,F3,_,A3,_,
      G3,_,D3,_,G3,_,D3,_,  C3,_,G3,_,C3,_,_,_,
    ];

    // ---- CHORD ARPEGGIOS (sine — soft harmonic bed) ----
    const chordTones = [
      [C4,E4,G4],[C4,E4,G4],[C4,E4,G4],[C4,E4,G4],           // Intro
      [C4,E4,G4],[A3,C4,E4],[C4,E4,G4],[G3,B3,D4],           // A1
      [C4,E4,G4],[A3,C4,E4],[F3,A3,C4],[C4,E4,G4],           // A2
      [A3,C4,E4],[F3,A3,C4],[G3,B3,D4],[E3,G3,B3],           // B1
      [A3,C4,E4],[F3,A3,C4],[D3,F3,A3],[C4,E4,G4],           // B2
      [F3,A3,C4],[G3,B3,D4],[E3,G3,B3],[A3,C4,E4],           // Bridge
      [C4,E4,G4],[A3,C4,E4],[C4,E4,G4],[G3,B3,D4],           // A'1
      [C4,E4,G4],[F3,A3,C4],[G3,B3,D4],[C4,E4,G4],           // A'2
    ];
    const arpeggio = [];
    for (const ch of chordTones) {
      for (let i = 0; i < 8; i++) arpeggio.push(ch[i % 3]);
    }

    const totalNotes = melody.length;
    const loopDuration = totalNotes * eighth;

    // Helper: schedule one short oscillator note
    const note = (freq, time, dur, type, vol) => {
      if (!freq) return;
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, time);
      g.gain.setValueAtTime(vol, time);
      g.gain.exponentialRampToValueAtTime(0.001, time + dur);
      o.connect(g);
      g.connect(musicGain);
      o.start(time);
      o.stop(time + dur + 0.01);
    };

    // Noise buffer for hi-hats (created once, reused)
    const noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.04, ctx.sampleRate);
    const nd = noiseBuf.getChannelData(0);
    for (let j = 0; j < nd.length; j++) nd[j] = Math.random() * 2 - 1;

    const playLoop = () => {
      if (!this.bgMusicPlaying) return;
      const t0 = ctx.currentTime + 0.05;

      // ── Lead melody (square wave, articulated) ──
      for (let i = 0; i < melody.length; i++) {
        if (!melody[i]) continue;
        note(melody[i], t0 + i * eighth, eighth * 0.8, 'square', 0.20);
      }

      // ── Bass line (triangle wave) ──
      for (let i = 0; i < bassLine.length; i++) {
        if (!bassLine[i]) continue;
        note(bassLine[i], t0 + i * eighth, eighth * 0.9, 'triangle', 0.32);
      }

      // ── Arpeggios (sine wave, gentle) ──
      for (let i = 0; i < arpeggio.length; i++) {
        if (!arpeggio[i]) continue;
        note(arpeggio[i], t0 + i * eighth, eighth * 0.55, 'sine', 0.08);
      }

      // ── Percussion ──
      for (let i = 0; i < totalNotes; i++) {
        const beat = i % 8;
        const t = t0 + i * eighth;

        // Kick drum on beats 1 & 3 (pitch-dropping sine)
        if (beat === 0 || beat === 4) {
          const ko = ctx.createOscillator();
          const kg = ctx.createGain();
          ko.type = 'sine';
          ko.frequency.setValueAtTime(150, t);
          ko.frequency.exponentialRampToValueAtTime(40, t + 0.12);
          kg.gain.setValueAtTime(0.28, t);
          kg.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
          ko.connect(kg);
          kg.connect(musicGain);
          ko.start(t);
          ko.stop(t + 0.2);
        }

        // Hi-hat on every other eighth note (filtered noise)
        if (beat % 2 === 0) {
          const ns = ctx.createBufferSource();
          ns.buffer = noiseBuf;
          const ng = ctx.createGain();
          ng.gain.setValueAtTime(0.045, t);
          ng.gain.exponentialRampToValueAtTime(0.001, t + 0.035);
          const hpf = ctx.createBiquadFilter();
          hpf.type = 'highpass';
          hpf.frequency.value = 7000;
          ns.connect(hpf);
          hpf.connect(ng);
          ng.connect(musicGain);
          ns.start(t);
          ns.stop(t + 0.05);
        }

        // Snare on beat 4 of every 2nd bar (noise + tone)
        if (beat === 6 && (Math.floor(i / 8) % 2 === 1)) {
          note(200, t, 0.08, 'triangle', 0.12);
          const sn = ctx.createBufferSource();
          sn.buffer = noiseBuf;
          const sg = ctx.createGain();
          sg.gain.setValueAtTime(0.07, t);
          sg.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
          sn.connect(sg);
          sg.connect(musicGain);
          sn.start(t);
          sn.stop(t + 0.1);
        }
      }

      this._bgMusicTimeout = setTimeout(() => playLoop(), (loopDuration - 0.15) * 1000);
    };

    playLoop();
  }

  stopBackgroundMusic() {
    this.bgMusicPlaying = false;
    if (this._bgMusicTimeout) {
      clearTimeout(this._bgMusicTimeout);
      this._bgMusicTimeout = null;
    }
  }
}

  <script>
// ============================================================
//  GAMEPLAY RECORDER & REPLAY LIBRARY
//  Records human + bot gameplay as state→action pairs.
//  Stored in localStorage, consulted by the bot as an advisor.
// ============================================================

(function () {
  'use strict';

  const STORAGE_KEY = 'bullrun_replays';
  const MAX_REPLAYS = 20;         // Keep top 20 replays
  const SAMPLE_INTERVAL = 6;      // Record every 6th frame (~10 samples/sec at 60fps)
  const STATE_BUCKET_X = 40;      // Quantize X to 40px buckets
  const STATE_BUCKET_Y = 30;      // Quantize Y to 30px buckets

  // ── Replay Library ──────────────────────────────────────────
  const replayLib = {
    replays: [],         // Array of completed replay objects
    stateIndex: {},      // Fast lookup: stateKey → [{ action, score, replayIdx }]
    bestScore: 0,
  };

  // Load from localStorage
  function loadLibrary() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        replayLib.replays = data.replays || [];
        replayLib.bestScore = data.bestScore || 0;
        rebuildIndex();
        console.log('%c[REPLAY LIB] Loaded ' + replayLib.replays.length +
          ' replays (best: $' + replayLib.bestScore + ')',
          'color:#00BFFF;font-weight:bold');
      }
    } catch (e) {
      console.warn('[REPLAY LIB] Failed to load:', e);
    }
  }

  // Save to localStorage
  function saveLibrary() {
    try {
      const data = {
        replays: replayLib.replays,
        bestScore: replayLib.bestScore,
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) {
      console.warn('[REPLAY LIB] Failed to save:', e);
    }
  }

  // Build fast state→action lookup index from all replays
  function rebuildIndex() {
    replayLib.stateIndex = {};
    for (let ri = 0; ri < replayLib.replays.length; ri++) {
      const replay = replayLib.replays[ri];
      const weight = replay.score / Math.max(1, replayLib.bestScore); // 0-1 quality weight
      for (const frame of replay.frames) {
        const key = frame.key;
        if (!replayLib.stateIndex[key]) replayLib.stateIndex[key] = [];
        replayLib.stateIndex[key].push({
          action: frame.action,
          score: replay.score,
          weight: weight,
          replayIdx: ri,
        });
      }
    }
  }

  // ── State Encoding ──────────────────────────────────────────
  // Quantize the game state into a lookup key
  function encodeState(playerX, playerY, levelIdx, extras) {
    const bx = Math.round(playerX / STATE_BUCKET_X);
    const by = Math.round(playerY / STATE_BUCKET_Y);
    // extras: onGround, nearEnemy, nearItem, nearPit
    const flags =
      (extras.onGround ? 1 : 0) |
      (extras.nearEnemy ? 2 : 0) |
      (extras.nearItem ? 4 : 0) |
      (extras.nearPit ? 8 : 0);
    return levelIdx + ':' + bx + ':' + by + ':' + flags;
  }

  // Encode action as a compact number
  function encodeAction(left, right, jump, down) {
    return (left ? 1 : 0) | (right ? 2 : 0) | (jump ? 4 : 0) | (down ? 8 : 0);
  }

  function decodeAction(code) {
    return {
      left:  !!(code & 1),
      right: !!(code & 2),
      jump:  !!(code & 4),
      down:  !!(code & 8),
    };
  }

  // ── Active Recording Session ────────────────────────────────
  let recording = false;
  let currentReplay = null;
  let frameCounter = 0;
  let recordSource = 'human'; // 'human' or 'bot'

  function startRecording(source) {
    recording = true;
    recordSource = source || 'human';
    frameCounter = 0;
    currentReplay = {
      source: recordSource,
      score: 0,
      completed: false,
      timestamp: Date.now(),
      frames: [],
    };
  }

  function recordFrame(playerX, playerY, levelIdx, extras, actionLeft, actionRight, actionJump, actionDown) {
    if (!recording || !currentReplay) return;
    frameCounter++;
    if (frameCounter % SAMPLE_INTERVAL !== 0) return;

    const key = encodeState(playerX, playerY, levelIdx, extras);
    const action = encodeAction(actionLeft, actionRight, actionJump, actionDown);

    currentReplay.frames.push({ key, action });

    // Cap frame memory per replay (max ~3000 samples ≈ 5 min of play)
    if (currentReplay.frames.length > 3000) {
      currentReplay.frames.shift();
    }
  }

  function finishRecording(finalScore, completed) {
    if (!recording || !currentReplay) return;
    recording = false;
    currentReplay.score = finalScore || 0;
    currentReplay.completed = completed || false;

    // Only keep replays that scored something
    if (currentReplay.score > 0 && currentReplay.frames.length > 10) {
      replayLib.replays.push(currentReplay);
      if (currentReplay.score > replayLib.bestScore) {
        replayLib.bestScore = currentReplay.score;
      }

      // Keep only the top MAX_REPLAYS by score
      if (replayLib.replays.length > MAX_REPLAYS) {
        replayLib.replays.sort((a, b) => b.score - a.score);
        replayLib.replays = replayLib.replays.slice(0, MAX_REPLAYS);
      }

      rebuildIndex();
      saveLibrary();

      console.log('%c[REPLAY LIB] Saved ' + recordSource + ' replay: $' +
        currentReplay.score + ' (' + currentReplay.frames.length + ' frames) — ' +
        'Library: ' + replayLib.replays.length + ' replays',
        'color:#00BFFF;font-weight:bold');
    }
    currentReplay = null;
  }

  // ── Advisor: consult library for best action ────────────────
  // Returns { action: {left,right,jump,down}, confidence: 0-1 } or null
  function advise(playerX, playerY, levelIdx, extras) {
    const key = encodeState(playerX, playerY, levelIdx, extras);
    const entries = replayLib.stateIndex[key];
    if (!entries || entries.length === 0) return null;

    // Vote: weight each recorded action by the replay's quality
    const votes = {};
    let totalWeight = 0;
    for (const entry of entries) {
      const a = entry.action;
      if (!votes[a]) votes[a] = 0;
      votes[a] += entry.weight;
      totalWeight += entry.weight;
    }

    // Find the highest-voted action
    let bestAction = 0;
    let bestVotes = 0;
    for (const [action, weight] of Object.entries(votes)) {
      if (weight > bestVotes) {
        bestVotes = weight;
        bestAction = parseInt(action);
      }
    }

    const confidence = totalWeight > 0 ? bestVotes / totalWeight : 0;
    return {
      action: decodeAction(bestAction),
      confidence: confidence,
      sampleCount: entries.length,
    };
  }

  // ── Fuzzy advisor: check nearby states too ──────────────────
  function adviseFuzzy(playerX, playerY, levelIdx, extras) {
    // Try exact match first
    let result = advise(playerX, playerY, levelIdx, extras);
    if (result && result.sampleCount >= 2) return result;

    // Try nearby positions (±1 bucket)
    const offsets = [
      [STATE_BUCKET_X, 0], [-STATE_BUCKET_X, 0],
      [0, STATE_BUCKET_Y], [0, -STATE_BUCKET_Y],
    ];
    let bestResult = result;
    for (const [dx, dy] of offsets) {
      const r = advise(playerX + dx, playerY + dy, levelIdx, extras);
      if (r && (!bestResult || r.sampleCount > bestResult.sampleCount)) {
        bestResult = r;
      }
    }
    return bestResult;
  }

  // ── Public API ──────────────────────────────────────────────
  window.ReplayLib = {
    load: loadLibrary,
    save: saveLibrary,
    startRecording,
    recordFrame,
    finishRecording,
    advise: adviseFuzzy,
    getStats: () => ({
      replayCount: replayLib.replays.length,
      bestScore: replayLib.bestScore,
      indexSize: Object.keys(replayLib.stateIndex).length,
      totalFrames: replayLib.replays.reduce((s, r) => s + r.frames.length, 0),
    }),
    clear: () => {
      replayLib.replays = [];
      replayLib.stateIndex = {};
      replayLib.bestScore = 0;
      localStorage.removeItem(STORAGE_KEY);
      console.log('%c[REPLAY LIB] Cleared all replays', 'color:#FF6666');
    },
  };

  // Auto-load on init
  loadLibrary();
})();

// ==========================================
//  3D WORLD RENDERER (Three.js)
// ==========================================
// Renders the level geometry and themed backdrops as a real 3D scene on a
// WebGL canvas that sits underneath the 2D game canvas. Gameplay is still
// 2D: the perspective camera is placed so the z = 0 plane maps exactly onto
// the 960x540 virtual viewport, so every block's front face lines up pixel
// for pixel with the collision boxes, while depth (tops, sides, parallax,
// lighting, shadows) comes for free. Sprites, HUD and FX stay on the 2D
// canvas on top. If WebGL or Three.js is unavailable, the game falls back to
// the original 2D renderer.

const W3D_FOV = 50;
const W3D_GROUND_Y = 432;

// Seeded RNG so a level's backdrop is identical every time it's built
function w3dRng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const W3D_THEMES = {
  nightCity: {
    sky: ['#05051e', '#151540', '#3a2f5e'], fog: '#2a2550', fogNear: 1600, fogFar: 7000,
    hemi: ['#8a9cff', '#2a1a2a', 1.6], ambient: ['#404070', 0.7], sun: ['#d6deff', 2.6],
  },
  launchPad: {
    sky: ['#020210', '#0a0a2a', '#3a1a48'], fog: '#2a1636', fogNear: 1800, fogFar: 8000,
    hemi: ['#a090ff', '#301830', 1.5], ambient: ['#403050', 0.7], sun: ['#ffe6cc', 2.8],
  },
  tradingFloor: {
    sky: ['#1a1000', '#3a2a10', '#5a4424'], fog: '#3a2814', fogNear: 1400, fogFar: 5200,
    hemi: ['#ffd49a', '#3a2410', 1.7], ambient: ['#5a4020', 0.8], sun: ['#ffe0b0', 2.4],
  },
  cryptoMines: {
    sky: ['#06001a', '#150030', '#1a0a3a'], fog: '#160030', fogNear: 1100, fogFar: 4600,
    hemi: ['#a070ff', '#100020', 1.5], ambient: ['#30205a', 0.8], sun: ['#cbb0ff', 2.0],

// ==========================================

// Articulated low-poly models built from primitives. Units match the game:
// 54 tall standing (PLAYER_HEIGHT), feet at y = 0, facing local +z.
// Pivots: hips -> knees, shoulders -> elbows, so poses are just rotations.
class Investor3D {
  constructor(type) {
    const T = THREE;
    this.type = type;
    const chad = type === 'chad';
    const std = (color, extra) => new T.MeshStandardMaterial(Object.assign({ color, roughness: 0.6 }, extra || {}));
    const M = this.mats = {
      skin: std(0xf2c79a, { roughness: 0.55 }),
      suit: std(chad ? 0x1c1c48 : 0x34306e, { roughness: 0.5 }),
      suitLight: std(chad ? 0x2a2a62 : 0x4a4590, { roughness: 0.45 }),
      pants: std(chad ? 0x15152e : 0x1e1a40, { roughness: 0.6 }),
      shoe: std(chad ? 0x111111 : 0x5a1020, { roughness: 0.25, metalness: 0.3 }),
      shirt: std(chad ? 0xf4f4f8 : 0xece2d0, { roughness: 0.7 }),
      tie: std(0xc8102e, { roughness: 0.4 }),
      hair: std(chad ? 0x2a2018 : 0x8b4513, { roughness: 0.45, metalness: 0.05 }),
      white: std(0xffffff, { roughness: 0.3 }),
      pupil: std(chad ? 0x2a4a7a : 0x3a6a3a, { roughness: 0.2 }),
      dark: std(0x1a1010, { roughness: 0.5 }),
      lip: std(chad ? 0x9a5040 : 0xc0405a, { roughness: 0.4 }),
      gold: std(0xffd700, { roughness: 0.25, metalness: 0.9 }),
      leather: std(0x7a5212, { roughness: 0.5 }),
      tabletBody: std(0x22222a, { roughness: 0.3, metalness: 0.6 }),
      screen: new T.MeshBasicMaterial({ color: 0xffffff, toneMapped: false }),
      headband: std(0xcc0000, { roughness: 0.5 }),
    };
    this.allMats = Object.values(M);

    const root = this.root = new T.Group();      // positioned/scaled by caller
    const body = this.body = new T.Group();      // bobs/leans
    root.add(body);
    const mesh = (geo, mat, x, y, z, parent) => {
      const m = new T.Mesh(geo, mat);
      m.position.set(x || 0, y || 0, z || 0);
      m.castShadow = true;
      (parent || body).add(m);
      return m;
    };

    // ---- Legs (hip -> knee pivots) ----
    this.legs = [];
    for (const side of [-1, 1]) {
      const hip = new T.Group();
      hip.position.set(side * 4.3, 19.3, 0);
      body.add(hip);
      mesh(new T.CapsuleGeometry(3.3, 6, 4, 10), M.pants, 0, -5, 0, hip);
      const knee = new T.Group();
      knee.position.set(0, -9.5, 0);
      hip.add(knee);
      mesh(new T.SphereGeometry(3.15, 10, 8), M.pants, 0, 0, 0, knee);
      mesh(new T.CapsuleGeometry(3.0, 5.5, 4, 10), M.pants, 0, -4.5, 0, knee);
      const shoe = mesh(new T.CapsuleGeometry(2.8, 5, 4, 10), M.shoe, 0, -8.0, 1.8, knee);
      shoe.rotation.x = Math.PI / 2;
      shoe.scale.set(1.05, 1, 0.8);
      if (!chad) mesh(new T.CylinderGeometry(0.8, 0.6, 3, 6), M.shoe, 0, -10, -1.8, knee); // heel
      this.legs.push({ hip, knee });
    }

    // ---- Torso ----
    const torso = this.torso = new T.Group();
    torso.position.y = 18;
    body.add(torso);
    const jacket = mesh(new T.CapsuleGeometry(6.4, 7.5, 6, 16), M.suit, 0, 10, 0, torso);
    jacket.scale.set(1.38, 1, 0.92);
    // shirt V, tie / blouse, lapels, buttons on the chest (front = +z)
    const vee = mesh(new T.ConeGeometry(4.2, 9, 3), M.shirt, 0, 14.2, 5.6, torso);
    vee.rotation.set(Math.PI, 0, 0);
    vee.scale.set(1, 1, 0.35);
    for (const side of [-1, 1]) {
      const lapel = mesh(new T.BoxGeometry(2.6, 10, 0.9), M.suitLight, side * 3.3, 13.4, 5.9, torso);
      lapel.rotation.z = -side * 0.38;
      lapel.rotation.x = -0.12;
    }
    if (chad) {
      mesh(new T.BoxGeometry(2.0, 1.6, 1.2), M.tie, 0, 17.6, 6.2, torso);           // knot
      const tie = mesh(new T.ConeGeometry(1.7, 9, 4), M.tie, 0, 12.4, 6.4, torso);
      tie.rotation.set(Math.PI, Math.PI / 4, 0);
      tie.scale.set(1, 1, 0.35);
      mesh(new T.BoxGeometry(2.8, 0.7, 0.8), M.gold, 0, 13.5, 6.7, torso);          // tie bar
    } else {
      // pearl necklace
      for (let i = 0; i < 9; i++) {
        const a = Math.PI * (0.15 + 0.7 * i / 8);
        mesh(new T.SphereGeometry(0.55, 8, 6), M.white, Math.cos(a) * 3.4, 17.8 - Math.sin(a) * 2.6, 5.9 - Math.abs(Math.cos(a)) * 1.2, torso);
      }
    }
    for (const by of [7.5, 4.2]) mesh(new T.SphereGeometry(0.6, 8, 6), M.gold, 0.2, by, 6.0, torso);
    // pocket square / belt
    if (chad) mesh(new T.ConeGeometry(1.1, 1.6, 3), M.shirt, -5.6, 12.6, 5.3, torso);
    mesh(new T.CylinderGeometry(6.6, 6.6, 1.4, 16), chad ? M.dark : M.gold, 0, 1.3, 0, torso).scale.set(1.35, 1, 0.9);

    // ---- Arms (shoulder -> elbow pivots) ----
    this.arms = [];
    for (const side of [-1, 1]) {
      const sh = new T.Group();
      sh.position.set(side * 9.6, 17, 0);
      torso.add(sh);
      mesh(new T.SphereGeometry(3.2, 12, 8), M.suit, 0, 0, 0, sh);                   // shoulder pad
      mesh(new T.CapsuleGeometry(2.5, 5, 4, 10), M.suit, 0, -4.3, 0, sh);
      const elbow = new T.Group();
      elbow.position.set(0, -8.4, 0);
      sh.add(elbow);
      mesh(new T.SphereGeometry(2.45, 10, 8), M.suit, 0, 0, 0, elbow);
      mesh(new T.CapsuleGeometry(2.3, 4.5, 4, 10), M.suit, 0, -3.6, 0, elbow);
      mesh(new T.CylinderGeometry(2.1, 2.1, 1, 10), M.shirt, 0, -6.9, 0, elbow);       // cuff
      const hand = mesh(new T.SphereGeometry(2.2, 12, 8), M.skin, 0, -8.6, 0.3, elbow);
      hand.scale.set(0.95, 1.1, 0.9);
      this.arms.push({ sh, elbow, hand, side });
    }

    // Props in the right hand (side = +1 -> model's left from viewer; use index 1)
    const holder = new T.Group();
    holder.position.set(0, -9.5, 0.5);
    this.arms[1].elbow.add(holder);
    if (chad) {
      mesh(new T.BoxGeometry(2.2, 8.5, 11), M.leather, 0, -5.4, 0, holder);
      mesh(new T.BoxGeometry(2.4, 1.2, 11.2), M.gold, 0, -2.4, 0, holder);
      mesh(new T.BoxGeometry(2.6, 1.2, 1.6), M.gold, 0, -3.4, 0, holder);
      const handle = mesh(new T.TorusGeometry(1.6, 0.45, 6, 12, Math.PI), M.dark, 0, -1.2, 0, holder);
      handle.rotation.y = Math.PI / 2;
    } else {
      const tablet = new T.Group();
      tablet.position.set(0, -2.5, 3.2);
      tablet.rotation.x = -0.9;
      holder.add(tablet);
      mesh(new T.BoxGeometry(9, 12, 0.8), M.tabletBody, 0, 0, 0, tablet);
      for (const face of [1, -1]) {            // screen on both faces so it always reads
        const scr = mesh(new T.PlaneGeometry(8, 10.6), M.screen, 0, 0, 0.45 * face, tablet);
        if (face < 0) scr.rotation.y = Math.PI;
        scr.castShadow = false;
      }
    }

    // ---- Head ----
    const head = this.head = new T.Group();
    head.position.y = 37.5;
    body.add(head);
    mesh(new T.CylinderGeometry(2.4, 2.8, 3.5, 10), M.skin, 0, 0.6, 0, head);         // neck
    mesh(new T.CylinderGeometry(3.6, 3.2, 1.8, 12), M.shirt, 0, -0.4, 0.2, head);      // collar
    const skull = mesh(new T.SphereGeometry(8.6, 24, 18), M.skin, 0, 8.5, 0.4, head);
    skull.scale.set(1.0, 1.03, 0.98);
    const jaw = mesh(new T.SphereGeometry(6.8, 18, 12), M.skin, 0, 5.4, 1.6, head);
    jaw.scale.set(chad ? 1.05 : 0.95, 0.85, 0.95);
    for (const side of [-1, 1]) {
      mesh(new T.SphereGeometry(1.9, 10, 8), M.skin, side * 8.4, 8, 0, head).scale.set(0.5, 1, 0.8); // ears
      const ew = mesh(new T.SphereGeometry(1.75, 12, 10), M.white, side * 3.2, 9.4, 7.3, head);
      ew.scale.set(1, chad ? 0.9 : 1.15, 0.6);
      mesh(new T.SphereGeometry(1.0, 10, 8), M.pupil, side * 3.2, 9.3, 8.25, head);
      mesh(new T.SphereGeometry(0.45, 6, 6), M.dark, side * 3.2, 9.3, 8.85, head);
      mesh(new T.SphereGeometry(0.3, 6, 6), M.white, side * 3.2 + 0.35, 9.8, 9.0, head); // eye glint
      const brow = mesh(new T.BoxGeometry(3.4, chad ? 0.9 : 0.55, 0.8), chad ? M.hair : M.dark, side * 3.3, 11.9, 7.6, head);
      brow.rotation.z = side * (chad ? -0.12 : -0.2);
      if (!chad) {
        const lash = mesh(new T.BoxGeometry(3.2, 0.5, 0.5), M.dark, side * 3.3, 10.8, 8.0, head);
        lash.rotation.z = side * -0.25;
        mesh(new T.SphereGeometry(0.6, 8, 6), M.gold, side * 8.5, 5.6, 0.6, head);   // earrings
      }
    }
    mesh(new T.SphereGeometry(1.1, 10, 8), M.skin, 0, 7.6, 8.6, head).scale.set(0.9, 1.1, 1);  // nose
    const smile = mesh(new T.TorusGeometry(2.3, chad ? 0.42 : 0.5, 6, 14, Math.PI * 0.85), M.lip, 0, 5.4, 7.6, head);
    smile.rotation.z = Math.PI + Math.PI * 0.075;
    smile.rotation.x = -0.25;

    // Hair
    if (chad) {
      const cap = mesh(new T.SphereGeometry(9.1, 24, 14, 0, Math.PI * 2, 0, Math.PI * 0.45), M.hair, 0, 9.3, -0.6, head);
      cap.scale.set(1.02, 1.0, 1.05);
      cap.rotation.x = -0.28;
      const back = mesh(new T.SphereGeometry(8.9, 20, 12, Math.PI * 0.5, Math.PI, Math.PI * 0.2, Math.PI * 0.45), M.hair, 0, 8.6, -0.9, head);
      back.rotation.y = Math.PI;
      const quiff = mesh(new T.SphereGeometry(4.2, 16, 10), M.hair, 1.0, 16.2, 4.2, head);
      quiff.scale.set(1.5, 0.62, 0.9);
      quiff.rotation.z = -0.18;
      for (const side of [-1, 1]) mesh(new T.BoxGeometry(1.4, 4.2, 3.4), M.hair, side * 8.3, 10.2, 1.2, head); // sideburns
    } else {
      const cap = mesh(new T.SphereGeometry(9.5, 24, 14, 0, Math.PI * 2, 0, Math.PI * 0.5), M.hair, 0, 8.8, -0.6, head);
      cap.scale.set(1.04, 1.05, 1.06);
      cap.rotation.x = -0.48;
      const fall = mesh(new T.CapsuleGeometry(8.6, 8, 6, 16), M.hair, 0, 4.4, -4.5, head);   // long hair behind
      fall.scale.set(1.06, 1, 0.6);
      for (const side of [-1, 1]) {
        const strand = mesh(new T.CapsuleGeometry(2.4, 11, 4, 10), M.hair, side * 7.8, 5.2, 2.6, head);
        strand.rotation.z = side * -0.08;
        const curl = mesh(new T.SphereGeometry(2.7, 10, 8), M.hair, side * 7.4, -1.6, 3.0, head);
        curl.scale.set(1.1, 0.8, 1);
      }
      const fringe = mesh(new T.SphereGeometry(4.6, 16, 10), M.hair, -2.4, 14.6, 5.4, head);
      fringe.scale.set(1.55, 0.6, 0.75);
      fringe.rotation.z = 0.32;
    }

    // Lucky headband + cat ears (shown when hasHeadband)
    const hb = this.headband = new T.Group();
    hb.position.y = 13.6;
    head.add(hb);
    const band = mesh(new T.TorusGeometry(9.2, 1.0, 6, 28), M.headband, 0, 0, 0.3, hb);
    band.rotation.x = Math.PI / 2;
    for (const side of [-1, 1]) {
      const ear = mesh(new T.ConeGeometry(2.8, 5.5, 4), M.headband, side * 5.6, 4.0, -0.5, hb);
      ear.rotation.z = side * -0.35;
      const tail = mesh(new T.CapsuleGeometry(0.7, 6, 3, 6), M.headband, side * 1.6, -2.6, -9.4, hb);
      tail.rotation.x = 0.9;
      tail.rotation.z = side * 0.3;
    }
    hb.visible = false;

    if (!chad) this._buildTabletScreen();
  }

  _buildTabletScreen() {
    const c = document.createElement('canvas');
    c.width = 96; c.height = 128;
    const g = c.getContext('2d');
    g.fillStyle = '#0b1e3a'; g.fillRect(0, 0, 96, 128);
    g.fillStyle = '#4488FF'; g.fillRect(0, 0, 96, 18);
    g.fillStyle = '#fff'; g.font = 'bold 12px sans-serif'; g.fillText('DIV ▲', 6, 13);
    g.strokeStyle = '#00FF88'; g.lineWidth = 4; g.beginPath();
    g.moveTo(6, 110); g.lineTo(26, 92); g.lineTo(44, 98); g.lineTo(64, 64); g.lineTo(90, 36); g.stroke();
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    this.mats.screen.map = t;
    this.screenTex = t;
  }

  dispose() {
    this.root.traverse(o => { if (o.geometry) o.geometry.dispose(); });
    for (const m of this.allMats) m.dispose();
    if (this.screenTex) this.screenTex.dispose();
  }

  // Pose the rig. p: { state, t, vy, onGround, crouching, dead, deadT, headband, powered }
  pose(p) {
    const t = p.t;
    const L = this.legs, A = this.arms;
    let hipL = 0, hipR = 0, kneeL = 0, kneeR = 0;
    let shL = 0, shR = 0, elL = -0.15, elR = -0.15, armOutL = 0.12, armOutR = 0.12;
    let bob = 0, lean = 0, headTilt = 0, headTurn = 0, spin = 0;

    if (p.dead) {
      shL = shR = -2.8; armOutL = armOutR = 0.5; elL = elR = -0.2;
      hipL = -0.5; hipR = 0.4; kneeL = 0.8; kneeR = 0.6;
      spin = p.deadT * 9;
      headTilt = -0.3;
    } else if (p.crouching) {
      hipL = hipR = -1.25; kneeL = kneeR = 2.0;
      shL = shR = -0.5; elL = elR = -1.1;
      lean = 0.45; bob = -8.5;
      headTilt = -0.25;
      if (p.state === 'crouch_ready') bob += Math.sin(t * 30) * 0.4;
    } else if (!p.onGround) {
      if (p.vy < 0) {         // rising: tuck one knee, punch the sky
        hipL = -1.3; kneeL = 1.5; hipR = 0.35; kneeR = 0.5;
        shL = -2.7; elL = -0.3; shR = 0.6; elR = -0.9;
        lean = -0.05; headTilt = -0.15;
      } else {                // falling: flail a little
        const f = Math.sin(t * 14) * 0.25;
        hipL = -0.5 + f; kneeL = 0.7; hipR = 0.2 - f; kneeR = 0.4;
        shL = -0.4; shR = -0.4; armOutL = armOutR = 1.15 + f;
        elL = elR = -0.4;
        headTilt = 0.1;
      }
    } else if (p.state === 'running') {
      const ph = t * 12;
      const s = Math.sin(ph);
      hipL = s * 0.85; hipR = -s * 0.85;
      kneeL = Math.max(0, -Math.cos(ph)) * 1.3 + 0.15;
      kneeR = Math.max(0, Math.cos(ph)) * 1.3 + 0.15;
      shL = -s * 0.9; shR = s * 0.9;
      elL = elR = -1.0;
      bob = Math.abs(Math.cos(ph)) * 1.6 - 0.6;
      lean = 0.18;
      headTilt = 0.05;
    } else {                  // idle: breathe, glance around
      const b = Math.sin(t * 2.2);
      bob = b * 0.35;
      shL = 0.05 + b * 0.04; shR = -0.05 - b * 0.04;
      headTurn = Math.sin(t * 0.7) * 0.25;
      headTilt = Math.sin(t * 1.1) * 0.05;
      if (this.type === 'diana') { shR = -0.55; elR = -1.3; } // looking at her tablet
    }

    L[0].hip.rotation.x = hipL; L[0].knee.rotation.x = kneeL;
    L[1].hip.rotation.x = hipR; L[1].knee.rotation.x = kneeR;
    A[0].sh.rotation.set(shL, 0, -armOutL);
    A[1].sh.rotation.set(shR, 0, armOutR);
    A[0].elbow.rotation.x = elL;
    A[1].elbow.rotation.x = elR;
    this.body.position.y = bob;
    this.torso.rotation.x = lean;
    this.head.rotation.set(headTilt - lean * 0.5, headTurn, 0);
    this.body.rotation.y = spin;
    this.headband.visible = !!p.headband;
    const e = p.powered ? 0.35 + Math.sin(t * 6) * 0.15 : 0;
    this.mats.suit.emissive.setRGB(0, e * 0.8, e * 0.4);
    this.mats.suitLight.emissive.setRGB(0, e * 0.8, e * 0.4);
  }
}

class World3D {
  static create() {
    if (typeof THREE === 'undefined') {
      console.warn('[3D] Three.js not loaded, using 2D renderer');
      return null;
    }
    try {
      return new World3D();
    } catch (e) {
      console.warn('[3D] WebGL unavailable, using 2D renderer:', e);
      return null;
    }
  }

  constructor() {
    const T = THREE;
    this.canvas = document.createElement('canvas');
    this.canvas.id = 'world3d';
    document.body.insertBefore(this.canvas, document.body.firstChild);

    this.renderer = new T.WebGLRenderer({ canvas: this.canvas, antialias: true, powerPreference: 'high-performance' });
    const mobile = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, mobile ? 1.5 : 2));
    this.renderer.shadowMap.enabled = true;
    this.renderer.shadowMap.type = T.PCFSoftShadowMap;
    this.maxAniso = Math.min(8, this.renderer.capabilities.getMaxAnisotropy());

    this.scene = new T.Scene();
    this.cam = new T.PerspectiveCamera(W3D_FOV, CONFIG.VIRTUAL_WIDTH / CONFIG.VIRTUAL_HEIGHT, 10, 14000);
    // Distance at which the z = 0 plane fills the virtual viewport exactly
    this.camDist = (CONFIG.VIRTUAL_HEIGHT / 2) / Math.tan(T.MathUtils.degToRad(W3D_FOV / 2));

    this.textures = {};   // shared across levels
    this.materials = {};  // shared across levels
    this.levelTextures = []; // per-level, disposed on rebuild
    this.levelRef = null;
    this.root = null;
    this.tickers = [];    // per-frame animation callbacks for the current level
    this.dynamics = [];   // moving platforms / question blocks
    this.active = false;
    this.rect = { x: -1, y: -1, w: 0, h: 0 };
    this.camX = 0;
    this.camY = 0;

    this.hemi = new T.HemisphereLight(0xffffff, 0x222222, 1);
    this.ambient = new T.AmbientLight(0xffffff, 0.5);
    this.sun = new T.DirectionalLight(0xffffff, 2);
    this.sun.castShadow = true;
    this.sun.shadow.mapSize.set(mobile ? 1024 : 2048, mobile ? 1024 : 2048);
    const sc = this.sun.shadow.camera;
    sc.left = -1000; sc.right = 1000; sc.top = 800; sc.bottom = -800;
    sc.near = 50; sc.far = 4000;
    this.sun.shadow.bias = -0.0004;
    this.sun.shadow.normalBias = 1.5;
    // Soft fill from the camera side so characters and front faces read clearly
    this.fill = new T.DirectionalLight(0xfff4e8, 0.9);
    this.scene.add(this.hemi, this.ambient, this.sun, this.sun.target, this.fill, this.fill.target);
  }

  // ------------------------------------------------------------
  //  Frame entry points
  // ------------------------------------------------------------
  setActive(on) {
    if (on === this.active) return;
    this.active = on;
    this.canvas.style.display = on ? 'block' : 'none';
  }

  layout(x, y, w, h) {
    const r = this.rect;
    if (r.x === x && r.y === y && r.w === w && r.h === h) return;
    this.rect = { x, y, w, h };
    this.renderer.setSize(w, h, false);
    const s = this.canvas.style;
    s.left = x + 'px'; s.top = y + 'px'; s.width = w + 'px'; s.height = h + 'px';
  }

  // Keeps the 3D investor in sync with the gameplay Player each frame
  syncPlayer(player, time, dt) {
    if (!player) { if (this.investor) this.investor.root.visible = false; return; }
    if (!this.investor || this.investor.type !== player.characterType) {
      if (this.investor) { this.scene.remove(this.investor.root); this.investor.dispose(); }
      this.investor = new Investor3D(player.characterType);
      this.scene.add(this.investor.root);
      this.facing = player.facingRight ? 1 : -1;
    }
    const inv = this.investor;
    const r = inv.root;
    const flicker = player.damageInvTimer > 0 && Math.floor(player.damageInvTimer * 10) % 2 === 0 && !player.deathAnimating;
    r.visible = !flicker;

    const standH = player._getStandingHeight();
    const k = player.width / CONFIG.PLAYER_WIDTH;
    let sx = k, sy = standH / CONFIG.PLAYER_HEIGHT;
    if (player.crouching) { sy *= 0.82; sx *= 1.08; }
    else if (!player.deathAnimating) {
      if (player.landSquashTimer > 0 && player.onGround) {
        const q = player.landSquashTimer / 0.12;
        sx *= 1 + 0.16 * q; sy *= 1 - 0.2 * q;
      } else if (!player.onGround) {
        const st = Math.min(Math.abs(player.vy) / 900, 1) * 0.1;
        sy *= 1 + st; sx *= 1 - st * 0.6;
      }
    }
    r.scale.set(sx, sy, sx);
    // Stand slightly behind the gameplay plane so feet sit on the ground top
    r.position.set(player.x + player.width / 2, -(player.y + player.height), -8);
    // 3/4 view toward the camera, turning smoothly when changing direction
    const target = player.facingRight ? 1 : -1;
    this.facing += (target - this.facing) * Math.min(1, dt * 14);
    r.rotation.y = this.facing * 0.62;

    inv.pose({
      state: player.state, t: player.animTime, vy: player.vy, onGround: player.onGround,
      crouching: player.crouching, dead: player.deathAnimating, deadT: player.deathAnimTimer,
      headband: player.hasHeadband, powered: player.powered,
    });
  }

  // Character-select portrait, rendered on a small offscreen renderer and
  // returned as a canvas for the 2D title screen to draw.
  portrait(type, selected, time) {
    const T = THREE;
    if (!this.pr) {
      const c = document.createElement('canvas');
      const r = new T.WebGLRenderer({ canvas: c, antialias: true, alpha: true, preserveDrawingBuffer: true });
      r.setPixelRatio(1);
      r.setSize(360, 330, false);
      r.setClearColor(0x000000, 0);
      const scene = new T.Scene();
      scene.add(new T.HemisphereLight(0xb8c4ff, 0x302040, 1.6));
      const key = new T.DirectionalLight(0xfff0dd, 2.6);
      key.position.set(40, 80, 90);
      const rim = new T.DirectionalLight(0xffd700, 2.2);
      rim.position.set(-80, 40, -60);
      const rim2 = new T.DirectionalLight(0x66aaff, 1.6);
      rim2.position.set(80, 20, -60);
      scene.add(key, rim, rim2);
      const cam = new T.PerspectiveCamera(30, 360 / 330, 10, 1000);
      cam.position.set(0, 33, 108);
      cam.lookAt(0, 27, 0);
      this.pr = { r, scene, cam, models: {} };
    }
    const P = this.pr;
    let m = P.models[type];
    if (!m) { m = P.models[type] = new Investor3D(type); P.scene.add(m.root); }
    for (const k in P.models) P.models[k].root.visible = k === type;
    m.root.rotation.y = selected ? 0.35 + Math.sin(time * 1.2) * 0.45 : 0.45;
    m.pose({ state: 'idle', t: selected ? time : 0.4, vy: 0, onGround: true });
    if (selected) m.body.position.y += Math.abs(Math.sin(time * 3)) * 1.2;
    P.r.render(P.scene, P.cam);
    return P.r.domElement;
  }

  render(level, camera2d, themeName, time, shake, player) {
    if (level !== this.levelRef) this.build(level, themeName);
    const dt = this.lastTime !== undefined ? Math.max(0, Math.min(0.1, time - this.lastTime)) : 0;
    this.lastTime = time;

    const VW = CONFIG.VIRTUAL_WIDTH, VH = CONFIG.VIRTUAL_HEIGHT;
    this.camX = camera2d.x + VW / 2 - (shake ? shake.x : 0);
    this.camY = -(camera2d.y + VH / 2) + (shake ? shake.y : 0);
    this.cam.position.set(this.camX, this.camY, this.camDist);
    this.cam.lookAt(this.camX, this.camY, 0);

    // Shadow-casting light follows the view
    this.sun.target.position.set(this.camX, this.camY, -200);
    this.sun.position.set(this.camX - 500, this.camY + 900, 900);
    this.fill.target.position.set(this.camX, this.camY, 0);
    this.fill.position.set(this.camX + 200, this.camY + 150, 1000);

    for (const d of this.dynamics) d(time, dt);
    for (const t of this.tickers) t(time, dt);
    this.syncPlayer(player, time, dt);

    this.renderer.render(this.scene, this.cam);
  }

  // ------------------------------------------------------------
  //  Helpers
  // ------------------------------------------------------------
  canvasTex(key, w, h, draw, opts) {
    opts = opts || {};
    if (key && this.textures[key]) return this.textures[key];
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = opts.linear ? THREE.NoColorSpace : THREE.SRGBColorSpace;
    if (opts.repeat !== false) t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = this.maxAniso;
    if (key) this.textures[key] = t; else this.levelTextures.push(t);
    return t;
  }

  mat(key, params, Kind) {
    if (this.materials[key]) return this.materials[key];
    const m = new (Kind || THREE.MeshStandardMaterial)(params);
    this.materials[key] = m;
    return m;
  }

  // Box whose UVs tile in world units (tile px per texture repeat). With
  // stretchV, the four side faces map the texture once vertically (used for
  // faces that have a distinct top band, e.g. curbs).
  boxGeo(w, h, d, tile, stretchV) {
    const g = new THREE.BoxGeometry(w, h, d);
    if (!tile) return g;
    const uv = g.attributes.uv;
    // Face order: +x, -x, +y, -y, +z, -z (4 verts each)
    const dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
    for (let f = 0; f < 6; f++) {
      const side = f !== 2 && f !== 3;
      for (let i = 0; i < 4; i++) {
        const k = f * 4 + i;
        uv.setXY(k, uv.getX(k) * dims[f][0] / tile,
          (stretchV && side) ? uv.getY(k) : uv.getY(k) * dims[f][1] / tile);
      }
    }
    return g;
  }

  // Horizontal floor strip spanning x0..x1 at height y (world-down), from zNear back to zFar
  floor(x0, x1, y, zNear, zFar, material, tile, stretchV) {
    const w = x1 - x0, d = zNear - zFar;
    const g = new THREE.PlaneGeometry(w, d);
    const uv = g.attributes.uv;
    for (let i = 0; i < uv.count; i++) {
      uv.setXY(i, uv.getX(i) * w / tile, stretchV ? uv.getY(i) : uv.getY(i) * d / tile);
    }
    const m = new THREE.Mesh(g, material);
    m.rotation.x = -Math.PI / 2;
    m.position.set((x0 + x1) / 2, -y, (zNear + zFar) / 2);
    m.receiveShadow = true;
    this.root.add(m);
    return m;
  }

  // Vertical wall facing the camera
  wall(x0, x1, yTop, yBottom, z, material, tileU, tileV) {
    const w = x1 - x0, h = yBottom - yTop;
    const g = new THREE.PlaneGeometry(w, h);
    const uv = g.attributes.uv;
    for (let i = 0; i < uv.count; i++) {
      uv.setXY(i, uv.getX(i) * w / tileU, tileV ? uv.getY(i) * h / tileV : uv.getY(i));
    }
    const m = new THREE.Mesh(g, material);
    m.position.set((x0 + x1) / 2, -(yTop + yBottom) / 2, z);
    this.root.add(m);
    return m;
  }

  // Add a box to a group using 2D-style coordinates: (lx, ly) is the
  // top-left corner in world-down space relative to the group, zFront is the
  // camera-facing face (<= 0), d is depth into the screen.
  addBox(group, geo, material, lx, ly, w, h, zFront, d, cast) {
    const m = new THREE.Mesh(geo, material);
    m.position.set(lx + w / 2, -(ly + h / 2), zFront - d / 2);
    m.castShadow = cast !== false;
    m.receiveShadow = true;
    group.add(m);
    return m;
  }

  // Static backdrop props are batched into one mesh per material to keep
  // draw calls low. geo must already be transformed into world space; faces
  // optionally limits a BoxGeometry to some of its faces (+x,-x,+y,-y,+z,-z).
  mergeAdd(material, geo, faces, opts) {
    opts = opts || {};
    const key = material.uuid + (opts.cast ? 'c' : '') + (opts.receive ? 'r' : '');
    let b = this.merged.get(key);
    if (!b) {
      b = { material, cast: !!opts.cast, receive: !!opts.receive, pos: [], nor: [], uv: [] };
      this.merged.set(key, b);
    }
    const g = geo.index ? geo.toNonIndexed() : geo;
    const P = g.attributes.position, N = g.attributes.normal, U = g.attributes.uv;
    for (let v = 0; v < P.count; v++) {
      if (faces && faces.indexOf(Math.floor(v / 6)) < 0) continue;
      b.pos.push(P.getX(v), P.getY(v), P.getZ(v));
      b.nor.push(N.getX(v), N.getY(v), N.getZ(v));
      b.uv.push(U ? U.getX(v) : 0, U ? U.getY(v) : 0);
    }
    if (g !== geo) g.dispose();
    geo.dispose();
  }

  flushMerged() {
    for (const b of this.merged.values()) {
      if (!b.pos.length) continue;
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(b.pos, 3));
      g.setAttribute('normal', new THREE.Float32BufferAttribute(b.nor, 3));
      g.setAttribute('uv', new THREE.Float32BufferAttribute(b.uv, 2));
      g.computeBoundingSphere();
      const m = new THREE.Mesh(g, b.material);
      m.castShadow = b.cast;
      m.receiveShadow = b.receive;
      this.root.add(m);
    }
    this.merged.clear();
  }

  glowTex() {
    return this.canvasTex('glow', 128, 128, (c, w, h) => {
      const g = c.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
      g.addColorStop(0, 'rgba(255,255,255,1)');
      g.addColorStop(0.25, 'rgba(255,255,255,0.55)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = g;
      c.fillRect(0, 0, w, h);
    }, { repeat: false });
  }

  glow(color, size, opacity) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({
      map: this.glowTex(), color: new THREE.Color(color), transparent: true,
      opacity: opacity === undefined ? 0.8 : opacity,
      blending: THREE.AdditiveBlending, depthWrite: false,
    }));
    s.scale.set(size, size, 1);
    return s;
  }

  noise(c, w, h, count, colors, maxSize) {
    for (let i = 0; i < count; i++) {
      c.fillStyle = colors[i % colors.length];
      const s = 1 + Math.random() * (maxSize || 2);
      c.fillRect(Math.random() * w, Math.random() * h, s, s);
    }
  }

  // ------------------------------------------------------------
  //  Level build / teardown
  // ------------------------------------------------------------
  dispose() {
    if (!this.root) return;
    this.scene.remove(this.root);
    const shared = new Set(Object.values(this.materials));
    this.root.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) {
        const ms = Array.isArray(o.material) ? o.material : [o.material];
        for (const m of ms) if (!shared.has(m)) m.dispose();
      }
    });
    for (const t of this.levelTextures) t.dispose();
    this.levelTextures = [];
    this.root = null;
  }

  build(level, themeName) {
    const T = THREE;
    this.dispose();
    this.levelRef = level;
    this.tickers = [];
    this.dynamics = [];
    this.root = new T.Group();
    this.scene.add(this.root);
    this.merged = new Map();

    const name = W3D_THEMES[themeName] ? themeName : 'nightCity';
    const th = W3D_THEMES[name];
    this.themeName = name;
    this.rng = w3dRng(name.length * 7919 + (level.width | 0));

    // Sky gradient + fog that fades distant geometry into the horizon
    this.scene.background = this.canvasTex('sky_' + name, 4, 256, (c, w, h) => {
      const g = c.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, th.sky[0]);
      g.addColorStop(0.55, th.sky[1]);
      g.addColorStop(1, th.sky[2]);
      c.fillStyle = g;
      c.fillRect(0, 0, w, h);
    }, { repeat: false });
    this.scene.fog = new T.Fog(th.fog, th.fogNear, th.fogFar);
    this.hemi.color.set(th.hemi[0]);
    this.hemi.groundColor.set(th.hemi[1]);
    this.hemi.intensity = th.hemi[2];
