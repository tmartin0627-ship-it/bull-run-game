    this.ambient.color.set(th.ambient[0]);
    this.ambient.intensity = th.ambient[1];
    this.sun.color.set(th.sun[0]);
    this.sun.intensity = th.sun[1];

    this.x0 = -3500;
    this.x1 = level.width + 3500;

    // Level geometry
    for (const solid of level.solids) {
      if (solid instanceof QuestionBlock) this.buildQuestionBlock(solid);
      else if (solid instanceof MovingPlatform) this.buildMovingPlatform(solid);
      else if (solid.type === 'ground') this.buildGround(solid, level);
      else this.root.add(this.buildPlatform(solid.type, solid.x, solid.y, solid.width, solid.height));
    }

    // Bottomless-pit abyss
    this.floor(this.x0, this.x1, W3D_GROUND_Y + 330, 200, -2000,
      this.mat('abyss', { color: 0x020208, roughness: 1 }), 1000);

    for (const sign of level.memeSigns) this.buildSign(sign);
    this.buildGoalBeam(level.goalPosition);

    if (name === 'nightCity') this.buildNightCity(level);
    else if (name === 'launchPad') this.buildLaunchPad(level);
    else if (name === 'tradingFloor') this.buildTradingFloor(level);
    else if (name === 'cryptoMines') this.buildCryptoMines(level);
    this.flushMerged();
  }

  // ------------------------------------------------------------
  //  Ground
  // ------------------------------------------------------------
  groundDepth() { return 320; }

  groundMaterials() {
    const n = this.themeName;
    const key = 'ground_' + n;
    if (this.materials[key + '_top']) {
      return [this.materials[key + '_side'], this.materials[key + '_side'], this.materials[key + '_top'],
        this.materials[key + '_side'], this.materials[key + '_front'], this.materials[key + '_side']];
    }
    let topTex, frontTex, rough = 0.9, metal = 0;
    if (n === 'nightCity') {
      topTex = this.canvasTex(key + '_t', 128, 128, (c, w, h) => {
        c.fillStyle = '#4a4a6e'; c.fillRect(0, 0, w, h);
        this.noise(c, w, h, 500, ['#55557a', '#3f3f60', '#5a5a80']);
        c.strokeStyle = '#2d2d4a'; c.lineWidth = 3;
        c.strokeRect(0, 0, w, h);
        c.beginPath(); c.moveTo(0, h / 2); c.lineTo(w, h / 2); c.stroke();
      });
      frontTex = this.canvasTex(key + '_f', 128, 256, (c, w, h) => {
        // Granite block foundation under a lit curb
        c.fillStyle = '#20203a'; c.fillRect(0, 0, w, h);
        let row = 0;
        for (let y = 12; y < h; y += 32, row++) {
          for (let x = (row % 2) * -32; x < w; x += 64) {
            const v = 40 + Math.floor(Math.random() * 14);
            c.fillStyle = 'rgb(' + v + ',' + v + ',' + (v + 30) + ')';
            c.fillRect(x + 2, y + 2, 60, 28);
            c.fillStyle = 'rgba(255,255,255,0.06)'; c.fillRect(x + 2, y + 2, 60, 3);
          }
        }
        this.noise(c, w, h, 500, ['rgba(0,0,0,0.25)', 'rgba(255,255,255,0.05)']);
        c.fillStyle = '#7a7aa6'; c.fillRect(0, 0, w, 7);
        c.fillStyle = '#4a4a70'; c.fillRect(0, 7, w, 4);
      });
    } else if (n === 'launchPad') {
      topTex = this.canvasTex(key + '_t', 128, 128, (c, w, h) => {
        c.fillStyle = '#4a4656'; c.fillRect(0, 0, w, h);
        this.noise(c, w, h, 600, ['#55516a', '#3e3a4a', '#5a5670']);
        c.strokeStyle = '#2e2a3a'; c.lineWidth = 2; c.strokeRect(0, 0, w, h);
        c.fillStyle = 'rgba(20,10,10,0.25)';
        c.beginPath(); c.arc(w * 0.7, h * 0.3, 18, 0, Math.PI * 2); c.fill();
      });
      frontTex = this.canvasTex(key + '_f', 128, 256, (c, w, h) => {
        c.fillStyle = '#34303e'; c.fillRect(0, 0, w, h);
        this.noise(c, w, h, 600, ['#3e3a4a', '#2a2632']);
        for (let x = -20; x < w + 20; x += 32) {
          c.fillStyle = '#FFC400';
          c.beginPath(); c.moveTo(x, 0); c.lineTo(x + 16, 0); c.lineTo(x + 4, 16); c.lineTo(x - 12, 16); c.fill();
        }
        c.fillStyle = '#111'; c.fillRect(0, 16, w, 2);
      });
    } else if (n === 'tradingFloor') {
      topTex = this.canvasTex(key + '_t', 128, 128, (c, w, h) => {
        for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
          c.fillStyle = (i + j) % 2 ? '#7a6040' : '#a88a5c';
          c.fillRect(i * w / 2, j * h / 2, w / 2, h / 2);
        }
        c.strokeStyle = 'rgba(255,240,210,0.18)'; c.lineWidth = 1;
        for (let k = 0; k < 14; k++) {
          c.beginPath(); c.moveTo(Math.random() * w, Math.random() * h);
          c.bezierCurveTo(Math.random() * w, Math.random() * h, Math.random() * w, Math.random() * h, Math.random() * w, Math.random() * h);
          c.stroke();
        }
      });
      frontTex = this.canvasTex(key + '_f', 128, 256, (c, w, h) => {
        c.fillStyle = '#4a3220'; c.fillRect(0, 0, w, h);
        c.fillStyle = '#c9a24a'; c.fillRect(0, 0, w, 6);
        c.fillStyle = '#3a2618';
        c.fillRect(8, 20, w - 16, 90); c.fillRect(8, 124, w - 16, 120);
        c.strokeStyle = '#5c4028'; c.lineWidth = 3;
        c.strokeRect(8, 20, w - 16, 90); c.strokeRect(8, 124, w - 16, 120);
      });
      rough = 0.35; metal = 0.1;
    } else {
      topTex = this.canvasTex(key + '_t', 128, 128, (c, w, h) => {
        c.fillStyle = '#2c1f48'; c.fillRect(0, 0, w, h);
        this.noise(c, w, h, 700, ['#382a5a', '#22183a', '#40306a'], 3);
        c.strokeStyle = 'rgba(0,255,220,0.5)'; c.lineWidth = 1.5;
        c.beginPath(); c.moveTo(10, 20); c.lineTo(40, 50); c.lineTo(36, 90); c.lineTo(70, 120); c.stroke();
      });
      frontTex = this.canvasTex(key + '_f', 128, 256, (c, w, h) => {
        c.fillStyle = '#1c1430'; c.fillRect(0, 0, w, h);
        this.noise(c, w, h, 900, ['#2a1e46', '#150f26', '#33245a'], 4);
        c.fillStyle = '#a050ff'; c.fillRect(0, 0, w, 4);
        c.strokeStyle = 'rgba(170,80,255,0.45)'; c.lineWidth = 2;
        c.beginPath(); c.moveTo(0, 60); c.lineTo(50, 90); c.lineTo(80, 70); c.lineTo(128, 120); c.stroke();
      });
    }
    const top = this.mat(key + '_top', { map: topTex, roughness: rough, metalness: metal });
    const front = this.mat(key + '_front', { map: frontTex, roughness: 0.95,
      emissive: 0xffffff, emissiveMap: frontTex, emissiveIntensity: 0.3 });
    const side = this.mat(key + '_side', { map: frontTex, roughness: 0.95, color: 0xbbbbcc });
    return [side, side, top, side, front, side];
  }

  buildGround(solid, level) {
    // Extend the first/last segment past the level edge so the perspective
    // view never shows the world's end at the sides.
    let x = solid.x, w = solid.width;
    if (x <= 0) { w += x + 1500; x = -1500; }
    if (solid.x + solid.width >= level.width) w = (level.width + 1500) - x;
    const d = this.groundDepth();
    const geo = this.boxGeo(w, solid.height, d, 96, true);
    const m = new THREE.Mesh(geo, this.groundMaterials());
    m.position.set(x + w / 2, -(solid.y + solid.height / 2), -d / 2);
    m.receiveShadow = true;
    m.castShadow = true;
    this.root.add(m);
  }

  // ------------------------------------------------------------
  //  Platforms
  // ------------------------------------------------------------
  platformMats(type) {
    const k = 'plat_' + type;
    if (this.materials[k]) return this.materials[k];
    const T = THREE;
    let mats;
    if (type === 'desk') {
      const wood = this.canvasTex('wood', 128, 64, (c, w, h) => {
        c.fillStyle = '#8B6914'; c.fillRect(0, 0, w, h);
        for (let i = 0; i < 18; i++) {
          c.strokeStyle = i % 2 ? 'rgba(90,60,10,0.5)' : 'rgba(190,140,50,0.35)';
          c.lineWidth = 1 + Math.random() * 2;
          const y = Math.random() * h;
          c.beginPath(); c.moveTo(0, y);
          c.bezierCurveTo(w * 0.3, y + 4, w * 0.6, y - 4, w, y + Math.random() * 4 - 2); c.stroke();
        }
      });
      const top = new T.MeshStandardMaterial({ map: wood, color: 0xd8b070, roughness: 0.5 });
      const side = new T.MeshStandardMaterial({ map: wood, roughness: 0.65 });
      mats = { box: [side, side, top, side, side, side], leg: new T.MeshStandardMaterial({ color: 0x5a3a10, roughness: 0.6 }) };
    } else if (type === 'taxi') {
      const tex = this.canvasTex('taxi', 128, 32, (c, w, h) => {
        c.fillStyle = '#f0c040'; c.fillRect(0, 0, w, h);
        for (let x = 0; x < w; x += 16) {
          c.fillStyle = '#111'; c.fillRect(x, 12, 8, 6); c.fillRect(x + 8, 18, 8, 6);
          c.fillStyle = '#fff'; c.fillRect(x + 8, 12, 8, 6); c.fillRect(x, 18, 8, 6);
        }
      });
      const paint = new T.MeshStandardMaterial({ color: 0xf0c040, roughness: 0.3, metalness: 0.3 });
      const front = new T.MeshStandardMaterial({ map: tex, roughness: 0.3, metalness: 0.3 });
      mats = { box: [paint, paint, paint, paint, front, paint],
        light: new T.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffd700, emissiveIntensity: 1.2 }) };
    } else if (type === 'terminal') {
      const wood = new T.MeshStandardMaterial({ color: 0x4a3a2a, roughness: 0.55 });
      const top = new T.MeshStandardMaterial({ color: 0x6a5a48, roughness: 0.4 });
      const screen = this.canvasTex('termScreen', 128, 32, (c, w, h) => {
        c.fillStyle = '#041a08'; c.fillRect(0, 0, w, h);
        let y = 22;
        c.strokeStyle = '#00FF88'; c.lineWidth = 2; c.beginPath(); c.moveTo(0, y);
        for (let x = 8; x <= w; x += 8) { y = Math.max(4, Math.min(28, y + (Math.random() - 0.62) * 8)); c.lineTo(x, y); }
        c.stroke();
        c.fillStyle = '#00FF88'; c.font = 'bold 9px monospace'; c.fillText('$$$', 4, 10);
      }, { repeat: false });
      const scr = new T.MeshStandardMaterial({ color: 0x000000, emissive: 0xffffff, emissiveMap: screen, emissiveIntensity: 1.4 });
      const bezel = new T.MeshStandardMaterial({ color: 0x15151c, roughness: 0.4, metalness: 0.5 });
      mats = { box: [wood, wood, top, wood, wood, wood], monitor: [bezel, bezel, bezel, bezel, scr, bezel], bezel };
    } else if (type === 'column') {
      const stone = this.canvasTex('marble', 128, 128, (c, w, h) => {
        c.fillStyle = '#9a9aaa'; c.fillRect(0, 0, w, h);
        this.noise(c, w, h, 400, ['#a8a8b8', '#8c8c9c']);
        c.strokeStyle = 'rgba(255,255,255,0.2)';
        for (let i = 0; i < 6; i++) { c.beginPath(); c.moveTo(Math.random() * w, 0); c.lineTo(Math.random() * w, h); c.stroke(); }
      });
      const flutes = this.canvasTex('flutes', 128, 16, (c, w, h) => {
        for (let x = 0; x < w; x += 16) {
          const g = c.createLinearGradient(x, 0, x + 16, 0);
          g.addColorStop(0, '#6a6a7a'); g.addColorStop(0.5, '#b0b0c0'); g.addColorStop(1, '#6a6a7a');
          c.fillStyle = g; c.fillRect(x, 0, 16, h);
        }
      });
      const m = new T.MeshStandardMaterial({ map: stone, roughness: 0.4 });
      mats = { box: [m, m, m, m, m, m], cap: new T.MeshStandardMaterial({ map: stone, color: 0xd0d0e0, roughness: 0.35 }),
        shaft: new T.MeshStandardMaterial({ map: flutes, roughness: 0.45 }) };
    } else if (type === 'server') {
      const leds = this.canvasTex('serverLeds', 64, 32, (c, w, h) => {
        c.fillStyle = '#000'; c.fillRect(0, 0, w, h);
        for (let x = 4; x < w; x += 8) for (let y = 6; y < h; y += 10) {
          c.fillStyle = ((x * 7 + y * 3) % 13 > 4) ? '#00FFCC' : '#FF00FF';
          c.fillRect(x, y, 3, 3);
        }
      });
      const body = new T.MeshStandardMaterial({ color: 0x1a1a2a, roughness: 0.35, metalness: 0.6 });
      const front = new T.MeshStandardMaterial({ color: 0x14141f, roughness: 0.35, metalness: 0.6,
        emissive: 0xffffff, emissiveMap: leds, emissiveIntensity: 1.6 });
      const top = new T.MeshStandardMaterial({ color: 0x2a2a3a, roughness: 0.3, metalness: 0.6 });
      mats = { box: [body, body, top, body, front, body], front };
    } else if (type === 'crystal') {
      const m = new T.MeshStandardMaterial({ color: 0x7a10dd, emissive: 0x8a20ee, emissiveIntensity: 0.55,
        roughness: 0.15, metalness: 0.1, transparent: true, opacity: 0.88 });
      const topm = new T.MeshStandardMaterial({ color: 0xa040ff, emissive: 0xb050ff, emissiveIntensity: 0.6, roughness: 0.15 });
      mats = { box: [m, m, topm, m, m, m], shard: new T.MeshStandardMaterial({ color: 0xcc66ff, emissive: 0xaa33ff,
        emissiveIntensity: 1.0, roughness: 0.1, flatShading: true }) };
    } else if (type === 'rocket') {
      mats = {
        body: new T.MeshStandardMaterial({ color: 0xe8e8f0, roughness: 0.3, metalness: 0.4 }),
        red: new T.MeshStandardMaterial({ color: 0xff4444, roughness: 0.4, metalness: 0.2 }),
        port: new T.MeshStandardMaterial({ color: 0x224488, emissive: 0x4488ff, emissiveIntensity: 0.8 }),
        flame: new T.MeshBasicMaterial({ color: 0xffa500, transparent: true, opacity: 0.85, blending: T.AdditiveBlending, depthWrite: false }),
        core: new T.MeshBasicMaterial({ color: 0xffee88, transparent: true, opacity: 0.95, blending: T.AdditiveBlending, depthWrite: false }),
      };
    } else { // ledge (default)
      const stone = this.canvasTex('ledgeStone', 64, 64, (c, w, h) => {
        c.fillStyle = '#5a5a7a'; c.fillRect(0, 0, w, h);
        this.noise(c, w, h, 300, ['#66668a', '#4e4e6c']);
        c.strokeStyle = '#46465e'; c.lineWidth = 2; c.strokeRect(0, 0, w, h);
      });
      const m = new T.MeshStandardMaterial({ map: stone, roughness: 0.8 });
      mats = { box: [m, m, m, m, m, m], lip: new T.MeshStandardMaterial({ map: stone, color: 0xc8c8e0, roughness: 0.7 }) };
    }
    this.materials[k] = mats;
    return mats;
  }

  // Builds a platform group in local coords; group.position = (x, -y, 0)
  buildPlatform(type, x, y, w, h) {
    const T = THREE;
    const g = new T.Group();
    g.position.set(x, -y, 0);
    const M = this.platformMats(type);
    let D;
    switch (type) {
      case 'desk':
        D = 72;
        this.addBox(g, this.boxGeo(w, h, D, 128), M.box, 0, 0, w, h, 0, D);
        for (const lx of [4, w - 10]) for (const z of [-20, -D + 10]) {
          this.addBox(g, new T.BoxGeometry(6, 18, 6), M.leg, lx, h, 6, 18, z, 6);
        }
        break;
      case 'taxi':
        D = 64;
        this.addBox(g, this.boxGeo(w, h, D, 128), M.box, 0, 0, w, h, 0, D);
        this.addBox(g, new T.BoxGeometry(16, 8, 12), M.light, w / 2 - 8, -8, 16, 8, -D / 2 + 6, 12);
        const tg = this.glow('#ffd700', 50, 0.5);
        tg.position.set(w / 2, 4, -D / 2);
        g.add(tg);
        break;
      case 'terminal': {
        D = 72;
        this.addBox(g, this.boxGeo(w, h, D, 128), M.box, 0, 0, w, h, 0, D);
        const mw = Math.max(20, w - 12);
        this.addBox(g, new T.BoxGeometry(mw, 22, 4), M.monitor, 6, -24, mw, 22, -D + 14, 4);
        this.addBox(g, new T.BoxGeometry(6, 4, 6), M.bezel, w / 2 - 3, -3, 6, 4, -D + 15, 6);
        break;
      }
      case 'column': {
        D = 72;
        this.addBox(g, this.boxGeo(w + 8, 6, D + 8, 128), M.cap, -4, 0, w + 8, 6, 0, D + 8);
        this.addBox(g, this.boxGeo(w, h - 6, D, 128), M.box, 0, 6, w, h - 6, 0, D);
        const shaftLen = y + h < W3D_GROUND_Y ? W3D_GROUND_Y - (y + h) : 40;
        const r = Math.min(w * 0.32, 24);
        const shaft = new T.Mesh(new T.CylinderGeometry(r, r * 1.05, shaftLen, 20), M.shaft);
        shaft.position.set(w / 2, -(h + shaftLen / 2), -(20 + r)); // behind the player's depth
        shaft.castShadow = shaft.receiveShadow = true;
        g.add(shaft);
        break;
      }
      case 'server':
        D = 72;
        this.addBox(g, this.boxGeo(w, h, D, 64), M.box, 0, 0, w, h, 0, D);
        break;
      case 'crystal': {
        D = 60;
        this.addBox(g, new T.BoxGeometry(w, h, D), M.box, 0, 0, w, h, 0, D);
        const n = Math.max(2, Math.floor(w / 40));
        for (let i = 0; i < n; i++) {
          const sh = 12 + this.rng() * 18;
          const s = new T.Mesh(new T.ConeGeometry(5 + this.rng() * 4, sh, 5), M.shard);
          s.position.set((i + 0.5) * w / n, sh / 2 - 2, -D + 12 + this.rng() * 10);
          s.rotation.z = (this.rng() - 0.5) * 0.5;
          g.add(s);
        }
        const gl = this.glow('#cc44ff', w * 1.2, 0.35);
        gl.position.set(w / 2, -h / 2, -D / 2);
        g.add(gl);
        break;
      }
      case 'rocket': {
        const r = h / 2;
        const bodyW = w - 24;
        const body = new T.Mesh(new T.CylinderGeometry(r, r, bodyW, 24), M.body);
        body.rotation.z = Math.PI / 2;
        body.position.set(10 + bodyW / 2, -r, -r);
        const nose = new T.Mesh(new T.ConeGeometry(r, 18, 24), M.red);
        nose.rotation.z = -Math.PI / 2;
        nose.position.set(10 + bodyW + 9, -r, -r);
        g.add(body, nose);
        for (let i = 0; i < 4; i++) {
          const fin = new T.Mesh(new T.BoxGeometry(14, 3, r * 1.2), M.red);
          const a = i * Math.PI / 2;
          fin.position.set(10, -r + Math.cos(a) * r * 1.1, -r + Math.sin(a) * r * 1.1);
          fin.rotation.x = a;
          g.add(fin);
        }
        for (let px = 22; px < 10 + bodyW - 10; px += 22) {
          const p = new T.Mesh(new T.CylinderGeometry(3.5, 3.5, 2, 12), M.port);
          p.rotation.x = Math.PI / 2;
          p.position.set(px, -r, 0.5);
          g.add(p);
        }
        const flame = new T.Mesh(new T.ConeGeometry(r * 0.8, 24, 16, 1, true), M.flame);
        flame.rotation.z = Math.PI / 2;
        const core = new T.Mesh(new T.ConeGeometry(r * 0.45, 14, 12, 1, true), M.core);
        core.rotation.z = Math.PI / 2;
        const fg = this.glow('#ff9a30', 70, 0.6);
        g.add(flame, core, fg);
        const seed = x * 0.05 + y;
        this.tickers.push(t => {
          const f = 1 + Math.abs(Math.sin(seed + t * 20)) * 0.5;
          flame.scale.set(1, f, 1); core.scale.set(1, f, 1);
          flame.position.set(-12 * f + 2, -r, -r);
          core.position.set(-7 * f + 2, -r, -r);
          fg.position.set(-10, -r, -r + 6);
        });
        g.traverse(o => { if (o.isMesh && o.material !== M.flame && o.material !== M.core) o.castShadow = o.receiveShadow = true; });
        break;
      }
      default: // ledge
        D = 80;
        this.addBox(g, this.boxGeo(w, Math.max(1, h - 4), D, 64), M.box, 0, 4, w, Math.max(1, h - 4), 0, D);
        this.addBox(g, this.boxGeo(w + 4, 4, D + 4, 64), M.lip, -2, 0, w + 4, 4, 0, D + 4);
    }
    return g;
  }

  buildMovingPlatform(mp) {
    const g = this.buildPlatform(mp.type, mp.x, mp.y, mp.width, mp.height);
    this.root.add(g);
    this.dynamics.push(() => g.position.set(mp.x, -mp.y, 0));
  }

  buildQuestionBlock(qb) {
    const T = THREE;
    const s = CONFIG.BLOCK_SIZE;
    if (!this.materials.qblock) {
      const face = this.canvasTex('qface', 128, 128, (c, w, h) => {
        const g = c.createLinearGradient(0, 0, w, h);
        g.addColorStop(0, '#FFE866'); g.addColorStop(1, '#FFC400');
        c.fillStyle = g; c.fillRect(0, 0, w, h);
        c.strokeStyle = '#B8860B'; c.lineWidth = 8; c.strokeRect(8, 8, w - 16, h - 16);
        c.fillStyle = '#B8860B';
        for (const [px, py] of [[18, 18], [w - 18, 18], [18, h - 18], [w - 18, h - 18]]) {
          c.beginPath(); c.arc(px, py, 5, 0, Math.PI * 2); c.fill();
        }
        c.font = 'bold 76px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillStyle = '#8a5a00'; c.fillText('?', w / 2 + 3, h / 2 + 7);
        c.fillStyle = '#FFFFFF'; c.fillText('?', w / 2, h / 2 + 3);
      }, { repeat: false });
      const used = this.canvasTex('qused', 64, 64, (c, w, h) => {
        c.fillStyle = '#8B7355'; c.fillRect(0, 0, w, h);
        this.noise(c, w, h, 200, ['#7a6448', '#987f60']);
        c.strokeStyle = '#6B5B3A'; c.lineWidth = 4; c.strokeRect(4, 4, w - 8, h - 8);
      }, { repeat: false });
      this.materials.qblock = new T.MeshStandardMaterial({ map: face, roughness: 0.4, metalness: 0.1,
        emissive: 0xffffff, emissiveMap: face, emissiveIntensity: 0.3 });
      this.materials.qused = new T.MeshStandardMaterial({ map: used, roughness: 0.8 });
    }
    const g = new T.Group();
    const cube = this.addBox(g, new T.BoxGeometry(s, s, s), this.materials.qblock, 0, 0, s, s, 0, s);
    const halo = this.glow('#ffcc00', s * 2.4, 0.25);
    halo.position.set(s / 2, -s / 2, -s - 4);
    g.add(halo);
    this.root.add(g);
    this.dynamics.push((t) => {
      g.position.set(qb.x, -(qb.y + qb.bumpOffset), 0);
      if (qb.used) {
        if (cube.material !== this.materials.qused) { cube.material = this.materials.qused; halo.visible = false; }
      } else {
        this.materials.qblock.emissiveIntensity = 0.3 + Math.sin(t * 4) * 0.1;
      }
    });
  }

  // ------------------------------------------------------------
  //  Decorations shared by all themes
  // ------------------------------------------------------------
  buildSign(sign) {
    const T = THREE;
    const size = sign.size || 20;
    const color = sign.color || '#00FF88';
    const scale = 3; // texture supersampling
    const measure = document.createElement('canvas').getContext('2d');
    measure.font = 'bold ' + size + 'px sans-serif';
    const panelW = measure.measureText(sign.text).width + 36;
    const panelH = size + 26;
    const tex = this.canvasTex(null, Math.ceil(panelW * scale), Math.ceil(panelH * scale), (c, w, h) => {
      c.fillStyle = 'rgba(8,8,24,1)'; c.fillRect(0, 0, w, h);
      c.strokeStyle = color; c.lineWidth = 3 * scale; c.strokeRect(2 * scale, 2 * scale, w - 4 * scale, h - 4 * scale);
      c.font = 'bold ' + size * scale + 'px sans-serif';
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.shadowColor = color; c.shadowBlur = 10 * scale;
      c.fillStyle = color; c.fillText(sign.text, w / 2, h / 2 + scale);
      c.shadowBlur = 0; c.fillStyle = '#ffffff'; c.globalAlpha = 0.6; c.fillText(sign.text, w / 2, h / 2 + scale);
    }, { repeat: false });
    const z = -70;
    const top = W3D_GROUND_Y - (sign.h || 150);
    const g = new T.Group();
    const faceMat = new T.MeshBasicMaterial({ map: tex, toneMapped: false });
    const backMat = new T.MeshStandardMaterial({ color: 0x1a1a30, roughness: 0.6, metalness: 0.5 });
    const panel = new T.Mesh(new T.BoxGeometry(panelW, panelH, 8), [backMat, backMat, backMat, backMat, faceMat, backMat]);
    panel.position.set(sign.x, -(top + panelH / 2), z);
    panel.castShadow = true;
    const poleLen = W3D_GROUND_Y - top - panelH;
    const pole = new T.Mesh(new T.CylinderGeometry(3.5, 4.5, poleLen, 10),
      this.mat('signPole', { color: 0x3a3a58, roughness: 0.5, metalness: 0.7 }));
    pole.position.set(sign.x, -(W3D_GROUND_Y - poleLen / 2), z - 6);
    pole.castShadow = true;
    const halo = this.glow(color, panelW * 1.6, 0.35);
    halo.scale.y = panelH * 3;
    halo.position.set(sign.x, -(top + panelH / 2), z - 10);
    g.add(panel, pole, halo);
    this.root.add(g);
    const phase = sign.x;
    this.tickers.push(t => {
      const flicker = Math.sin(t * 13 + phase * 0.7) > -0.92 ? 1 : 0.45;
      faceMat.color.setScalar(flicker);
      halo.material.opacity = 0.3 * flicker + Math.sin(t * 3 + phase) * 0.05;
    });
  }

  buildGoalBeam(goal) {
    const T = THREE;
    const beam = new T.Mesh(new T.CylinderGeometry(40, 60, 1600, 24, 1, true),
      new T.MeshBasicMaterial({ color: 0xffd700, transparent: true, opacity: 0.12, side: T.DoubleSide,
        blending: T.AdditiveBlending, depthWrite: false }));
    beam.position.set(goal.x + 24, -(W3D_GROUND_Y - 800), -90);
    const glow = this.glow('#ffd700', 260, 0.45);
    glow.position.set(goal.x + 24, -(W3D_GROUND_Y - 20), -90);
    this.root.add(beam, glow);
    this.tickers.push(t => {
      beam.material.opacity = 0.1 + Math.sin(t * 2.5) * 0.04;
      beam.rotation.y = t * 0.4;
    });
  }

  buildStars(count, color) {
    const T = THREE;
    const pos = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      pos[i * 3] = this.x0 - 6000 + this.rng() * (this.x1 - this.x0 + 12000);
      pos[i * 3 + 1] = -200 + this.rng() * 4200;
      pos[i * 3 + 2] = -9000 - this.rng() * 1500;
    }
    const geo = new T.BufferGeometry();
    geo.setAttribute('position', new T.BufferAttribute(pos, 3));
    const mat = new T.PointsMaterial({ color: color || 0xffffff, size: 2.2, sizeAttenuation: false,
      fog: false, transparent: true, opacity: 0.9, depthWrite: false });
    const pts = new T.Points(geo, mat);
    this.root.add(pts);
    this.tickers.push(t => { mat.opacity = 0.75 + Math.sin(t * 1.7) * 0.15; });
  }

  // A sky body that drifts slowly relative to the camera (moon, planets)
  buildSkyBody(radius, color, emissive, screenX, screenY, haloColor, followFactor) {
    const T = THREE;
    const m = new T.Mesh(new T.SphereGeometry(radius, 32, 16),
      new T.MeshStandardMaterial({ color, emissive, emissiveIntensity: 0.9, roughness: 1, fog: false }));
    const halo = this.glow(haloColor, radius * 5, 0.35);
    halo.material.fog = false;
    this.root.add(m, halo);
    const z = -8500;
    const k = (this.camDist - z) / this.camDist; // world units per screen pixel at that depth
    this.tickers.push(t => {
      const x = this.camX * followFactor + screenX * k;
      const y = this.camY + screenY * k;
      m.position.set(x, y, z);
      halo.position.set(x, y, z + 10);
      m.rotation.y = t * 0.03;
    });
  }

  // Scrolling LED ticker strip built from live/hardcoded stock quotes
  tickerTexture(stocks) {
    const items = (stocks || []).map(s => (s.symbol + ' ' + s.price.toFixed(2) + ' ' + (s.change >= 0 ? '▲' : '▼') + Math.abs(s.change).toFixed(1) + '%'));
    if (!items.length) items.push('BULL RUN ▲ TO THE MOON');
    return this.canvasTex(null, 2048, 64, (c, w, h) => {
      c.fillStyle = '#000'; c.fillRect(0, 0, w, h);
      c.font = 'bold 38px monospace'; c.textBaseline = 'middle';
      let x = 10, i = 0;
      while (x < w) {
        const s = stocks && stocks.length ? stocks[i % stocks.length] : { change: 1 };
        c.fillStyle = s.change >= 0 ? '#00FF88' : '#FF4444';
        const txt = items[i % items.length] + '   ';
        c.fillText(txt, x, h / 2);
        x += c.measureText(txt).width;
        i++;
      }
    });
  }

  // ------------------------------------------------------------
  //  Theme: Night City (Wall Street)
  // ------------------------------------------------------------
  windowTextures(key, litColors) {
    const base = this.canvasTex(key + '_map', 256, 256, (c, w, h) => {
      c.fillStyle = '#ffffff'; c.fillRect(0, 0, w, h);
      for (let r = 0; r < 8; r++) for (let q = 0; q < 8; q++) {
        c.fillStyle = '#0b0b18';
        c.fillRect(q * 32 + 7, r * 32 + 6, 18, 20);
      }
    });
    const lit = this.canvasTex(key + '_lit', 256, 256, (c, w, h) => {
      c.fillStyle = '#000'; c.fillRect(0, 0, w, h);
      for (let r = 0; r < 8; r++) for (let q = 0; q < 8; q++) {
        if (Math.random() > 0.3) continue;
        c.fillStyle = litColors[Math.floor(Math.random() * litColors.length)];
        c.globalAlpha = 0.6 + Math.random() * 0.4;
        c.fillRect(q * 32 + 7, r * 32 + 6, 18, 20);
      }
      c.globalAlpha = 1;
    });
    return { base, lit };
  }

  buildSkyline(rows, palette, winKey, litColors, groundLevel) {
    const T = THREE;
    const win = this.windowTextures(winKey, litColors);
    const roof = this.mat(winKey + '_roof', { color: 0x15152a, roughness: 0.9 });
    const facade = palette.map((col, i) => this.mat(winKey + '_facade' + i, {
      color: col, map: win.base, emissive: 0xffffff, emissiveMap: win.lit, emissiveIntensity: 0.9, roughness: 0.7, metalness: 0.2,
    }));
    const antennaMat = this.mat('antenna', { color: 0x555566, metalness: 0.8, roughness: 0.4 });
    const beacons = [];
    for (const row of rows) {
      let x = this.x0;
      while (x < this.x1) {
        const w = row.wMin + this.rng() * (row.wMax - row.wMin);
        const h = row.hMin + this.rng() * (row.hMax - row.hMin);
        const d = row.dMin + this.rng() * (row.dMax - row.dMin);
        const geo = this.boxGeo(w, h, d, 0);
        // windows: ~24 world px per cell (texture has 8 cells), random offset per building
        const uv = geo.attributes.uv;
        const ou = Math.floor(this.rng() * 8) / 8, ov = Math.floor(this.rng() * 8) / 8;
        const dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
        for (let f = 0; f < 6; f++) for (let i = 0; i < 4; i++) {
          const k = f * 4 + i;
          uv.setXY(k, ou + uv.getX(k) * dims[f][0] / 300, ov + uv.getY(k) * dims[f][1] / 300);
        }
        const fm = facade[Math.floor(this.rng() * facade.length)];
        const z = row.z - this.rng() * row.zJitter - d / 2;
        geo.translate(x + w / 2, -(groundLevel - h / 2), z);
        this.mergeAdd(fm, geo.clone(), [0, 1, 4, 5], { receive: row.shadows });
        this.mergeAdd(roof, geo, [2, 3]);
        if (this.rng() < 0.3) {
          const ah = 30 + this.rng() * 90;
          this.mergeAdd(antennaMat, new T.CylinderGeometry(1.5, 2.5, ah, 6).translate(x + w / 2, -(groundLevel - h - ah / 2), z));
          const bl = this.glow('#ff2020', 26, 0.9);
          bl.position.set(x + w / 2, -(groundLevel - h - ah), z);
          this.root.add(bl);
          beacons.push({ s: bl, phase: this.rng() * 6 });
        }
        x += w + row.gapMin + this.rng() * row.gapMax;
      }
    }
    this.tickers.push(t => {
      for (const b of beacons) b.s.visible = Math.sin(t * 3 + b.phase) > 0.2;
    });
  }

  buildNightCity(level) {
    const T = THREE;
    const gd = this.groundDepth();
    // Street with lane markings, then far sidewalk
    const asphalt = this.canvasTex('asphalt', 256, 256, (c, w, h) => {
      c.fillStyle = '#1c1c28'; c.fillRect(0, 0, w, h);
      this.noise(c, w, h, 1500, ['#24243a', '#16161f', '#2a2a40']);
      c.fillStyle = '#d8d8e0'; c.fillRect(0, 10, w, 4); c.fillRect(0, h - 14, w, 4);
      c.fillStyle = '#FFC400'; c.fillRect(0, h / 2 - 5, w * 0.5, 4); c.fillRect(0, h / 2 + 2, w * 0.5, 4);
    });
    this.floor(this.x0, this.x1, W3D_GROUND_Y + 10, -gd, -900,
      this.mat('road', { map: asphalt, roughness: 0.85 }), 256, true);
    this.floor(this.x0, this.x1, W3D_GROUND_Y, -900, -1100, this.groundMaterials()[2], 96);
    this.floor(this.x0, this.x1, W3D_GROUND_Y + 2, -1100, -9000,
      this.mat('cityFar', { color: 0x1a1a30, roughness: 1 }), 1000);

    this.buildSkyline([
      { z: -1120, zJitter: 60, wMin: 140, wMax: 260, hMin: 180, hMax: 460, dMin: 140, dMax: 240, gapMin: 40, gapMax: 160, shadows: true },
      { z: -2000, zJitter: 250, wMin: 180, wMax: 340, hMin: 420, hMax: 1100, dMin: 200, dMax: 340, gapMin: 120, gapMax: 320, shadows: false },
      { z: -3800, zJitter: 600, wMin: 260, wMax: 480, hMin: 800, hMax: 2200, dMin: 260, dMax: 480, gapMin: 200, gapMax: 600, shadows: false },
    ], ['#23234a', '#2c2c56', '#1c1c40', '#302a50'], 'cityWin', ['#FFE4B5', '#87CEEB', '#FFD27A'], W3D_GROUND_Y);

    // Scrolling stock ticker banners on the near row
    const tickTex = this.tickerTexture(level.tickerStocks);
    const tickMat = new T.MeshBasicMaterial({ map: tickTex, toneMapped: false });
    for (let x = 400; x < level.width; x += 2200) {
      const band = new T.Mesh(new T.PlaneGeometry(900, 36), tickMat);
      band.position.set(x + 400, -(W3D_GROUND_Y - 230), -1105);
      this.root.add(band);
    }
    tickTex.repeat.set(0.45, 1);
    this.tickers.push((t) => { tickTex.offset.x = (t * 0.04) % 1; });

    this.buildTraffic(level, gd);
    this.buildStreetLights(level, gd);
    this.buildStars(1400);
    this.buildSkyBody(160, 0xfffff0, 0x777766, 260, 170, '#fffbe0', 0.92);
  }

  buildTraffic(level, gd) {
    const T = THREE;
    const colors = [0xf0c040, 0xf0c040, 0xcc2233, 0x2a5ad0, 0xe8e8f0, 0xf0c040];
    const cars = [];
    const wheelMat = this.mat('wheel', { color: 0x111111, roughness: 0.8 });
    const glass = this.mat('carGlass', { color: 0x223344, roughness: 0.1, metalness: 0.8 });
    for (let i = 0; i < 10; i++) {
      const g = new T.Group();
      const paint = this.mat('car' + colors[i % colors.length], { color: colors[i % colors.length], roughness: 0.3, metalness: 0.5 });
      const body = new T.Mesh(new T.BoxGeometry(110, 26, 48), paint);
      body.position.y = 22;
      const cab = new T.Mesh(new T.BoxGeometry(60, 20, 44), glass);
      cab.position.set(-6, 44, 0);
      g.add(body, cab);
      for (const wx of [-34, 34]) for (const wz of [-24, 24]) {
        const wh = new T.Mesh(new T.CylinderGeometry(11, 11, 8, 14), wheelMat);
        wh.rotation.x = Math.PI / 2;
        wh.position.set(wx, 11, wz);
        g.add(wh);
      }
      const dir = i % 2 ? 1 : -1;
      const head = this.glow('#fff4cc', 60, 0.9);
      head.position.set(58 * dir, 24, 0);
      const tail = this.glow('#ff2222', 34, 0.8);
      tail.position.set(-58 * dir, 24, 0);
      g.add(head, tail);
      g.traverse(o => { if (o.isMesh) o.castShadow = true; });
      const lane = dir > 0 ? -gd - 170 : -gd - 420;
      g.position.set(0, -(W3D_GROUND_Y + 10), lane);
      this.root.add(g);
      cars.push({ g, dir, speed: 260 + this.rng() * 220, base: this.rng() * 4000 });
    }
    this.tickers.push(t => {
      const span = 4200;
      for (const c of cars) {
        const p = ((c.base + c.speed * t) % span + span) % span;
        c.g.position.x = this.camX - span / 2 + (c.dir > 0 ? p : span - p);
      }
    });
  }

  buildStreetLights(level, gd) {
    const T = THREE;
    const poleMat = this.mat('lampPole', { color: 0x2a2a40, metalness: 0.8, roughness: 0.4 });
    const bulb = this.mat('lampBulb', { color: 0xffffff, emissive: 0xffe8b0, emissiveIntensity: 2 }, T.MeshStandardMaterial);
    for (let x = 200; x < level.width + 400; x += 640) {
      const z = -gd + 30;
      const pole = new T.Mesh(new T.CylinderGeometry(3, 4, 230, 8), poleMat);
      pole.position.set(x, -(W3D_GROUND_Y - 115), z);
      const arm = new T.Mesh(new T.BoxGeometry(4, 4, 60), poleMat);
      arm.position.set(x, -(W3D_GROUND_Y - 228), z + 28);
      const lamp = new T.Mesh(new T.BoxGeometry(22, 6, 14), bulb);
      lamp.position.set(x, -(W3D_GROUND_Y - 224), z + 54);
      const halo = this.glow('#ffe0a0', 140, 0.35);
      halo.position.set(x, -(W3D_GROUND_Y - 215), z + 54);
      pole.castShadow = true;
      this.root.add(pole, arm, lamp, halo);
    }
  }

  // ------------------------------------------------------------
  //  Theme: Launch Pad (SpaceX IPO)
  // ------------------------------------------------------------
  buildLaunchPad(level) {
    const T = THREE;
    const gd = this.groundDepth();
    const apron = this.canvasTex('apron', 256, 256, (c, w, h) => {
      c.fillStyle = '#3a3646'; c.fillRect(0, 0, w, h);
      this.noise(c, w, h, 1500, ['#46425a', '#2e2a38', '#4c4860']);
      c.strokeStyle = '#2a2632'; c.lineWidth = 3; c.strokeRect(0, 0, w, h);
      c.strokeStyle = 'rgba(255,196,0,0.5)'; c.lineWidth = 4;
      c.beginPath(); c.moveTo(0, h * 0.5); c.lineTo(w, h * 0.5); c.stroke();
    });
    this.floor(this.x0, this.x1, W3D_GROUND_Y + 4, -gd, -2800, this.mat('apron', { map: apron, roughness: 0.9 }), 256);
    this.floor(this.x0, this.x1, W3D_GROUND_Y + 6, -2800, -10000, this.mat('desert', { color: 0x2a1a30, roughness: 1 }), 1000);

    const lattice = this.canvasTex('lattice', 64, 64, (c, w, h) => {
      c.clearRect(0, 0, w, h);
      c.strokeStyle = '#c03030'; c.lineWidth = 5;
      c.strokeRect(2, 2, w - 4, h - 4);
      c.beginPath(); c.moveTo(0, 0); c.lineTo(w, h); c.moveTo(w, 0); c.lineTo(0, h); c.stroke();
    });
    const towerMat = this.mat('tower', { map: lattice, alphaTest: 0.5, side: T.DoubleSide, roughness: 0.6, metalness: 0.5 });
    const rocketTex = this.canvasTex('rocketSkin', 64, 256, (c, w, h) => {
      c.fillStyle = '#eceff4'; c.fillRect(0, 0, w, h);
      c.fillStyle = '#1a1a22'; c.fillRect(0, h * 0.18, w, 10); c.fillRect(0, h * 0.82, w, 18);
      c.fillStyle = '#9aa0b0';
      for (let y = 30; y < h; y += 26) c.fillRect(0, y, w, 1);
      c.fillStyle = '#1a1a22'; c.font = 'bold 18px sans-serif'; c.save(); c.translate(w / 2 + 6, h * 0.5); c.rotate(-Math.PI / 2);
      c.textAlign = 'center'; c.fillText('BULL-X', 0, 0); c.restore();
    }, { repeat: false });
    const rocketMat = this.mat('rocketBig', { map: rocketTex, roughness: 0.35, metalness: 0.3 });
    const darkMat = this.mat('rocketDark', { color: 0x22222a, roughness: 0.4, metalness: 0.6 });
    const flameMat = new T.MeshBasicMaterial({ color: 0xffa040, transparent: true, opacity: 0.9, blending: T.AdditiveBlending, depthWrite: false });
    const coreMat = new T.MeshBasicMaterial({ color: 0xfff0b0, transparent: true, opacity: 1, blending: T.AdditiveBlending, depthWrite: false });

    const beacons = [];
    const launchers = [];
    for (let x = this.x0 + 200; x < this.x1; x += 650 + this.rng() * 500) {
      const z = -900 - this.rng() * 1800;
      const scale = 0.8 + this.rng() * 0.8;
      const th = 420 * scale + this.rng() * 200;
      this.mergeAdd(towerMat, this.boxGeo(56, th, 56, 64).translate(x, -(W3D_GROUND_Y + 4 - th / 2), z), null, { cast: true });
      const bl = this.glow('#ff3030', 40, 0.9);
      bl.position.set(x, -(W3D_GROUND_Y - th - 6), z);
      this.root.add(bl);
      beacons.push({ s: bl, phase: this.rng() * 6 });

      // Rocket beside the tower
      const r = 26 * scale, rh = th * 0.9;
      const rocket = new T.Group();
      const body = new T.Mesh(new T.CylinderGeometry(r, r, rh, 24), rocketMat);
      body.position.y = rh / 2;
      const nose = new T.Mesh(new T.ConeGeometry(r, r * 3, 24), darkMat);
      nose.position.y = rh + r * 1.5;
      rocket.add(body, nose);
      for (let i = 0; i < 4; i++) {
        const fin = new T.Mesh(new T.BoxGeometry(4, r * 2.2, r * 1.6), darkMat);
        fin.position.set(Math.cos(i * Math.PI / 2) * r, r * 1.1, Math.sin(i * Math.PI / 2) * r);
        fin.rotation.y = -i * Math.PI / 2;
        rocket.add(fin);
      }
      rocket.traverse(o => { if (o.isMesh) o.castShadow = true; });
      const flame = new T.Mesh(new T.ConeGeometry(r * 0.9, r * 6, 16, 1, true), flameMat);
      flame.rotation.x = Math.PI;
      const core = new T.Mesh(new T.ConeGeometry(r * 0.5, r * 3.5, 12, 1, true), coreMat);
      core.rotation.x = Math.PI;
      const fglow = this.glow('#ff9a40', r * 12, 0.9);
      rocket.add(flame, core, fglow);
      const baseX = x + 56 / 2 + r + 18, baseY = -(W3D_GROUND_Y + 4);
      rocket.position.set(baseX, baseY, z);
      this.root.add(rocket);
      launchers.push({ rocket, flame, core, fglow, r, baseY, period: 14 + this.rng() * 14, offset: this.rng() * 30,
        launches: this.rng() < 0.6 });
    }

    this.tickers.push(t => {
      for (const b of beacons) b.s.visible = Math.sin(t * 3 + b.phase) > 0;
      for (const L of launchers) {
        let alt = 0, burning = false;
        if (L.launches) {
          const c = (t + L.offset) % L.period;
          const ignite = L.period - 7; // last 7s of the cycle: ignition, liftoff, ascent
          if (c > ignite) {
            const lt = c - ignite;
            burning = true;
            alt = lt < 1 ? 0 : 0.5 * 140 * (lt - 1) * (lt - 1);
          }
        }
        L.rocket.position.y = L.baseY + alt;
        L.rocket.rotation.z = alt > 0 ? Math.min(0.25, alt / 9000) : 0;
        const f = burning ? 1 + Math.sin(t * 40 + L.offset) * 0.15 : 0;
        L.flame.visible = L.core.visible = L.fglow.visible = burning;
        if (burning) {
          L.flame.scale.set(f, f * (alt > 0 ? 1.6 : 1), f);
          L.flame.position.y = -L.r * 3 * L.flame.scale.y;
          L.core.position.y = -L.r * 1.75 * f;
          L.fglow.position.y = -L.r * 2;
        }
      }
    });

    this.buildStars(1800);
    this.buildSkyBody(120, 0xfffff0, 0x666655, 300, 150, '#fffbe0', 0.94);
    this.buildSkyBody(90, 0xc1440e, 0x5a1a04, -260, 200, '#ff6633', 0.95);
  }

  // ------------------------------------------------------------
  //  Theme: Trading Floor
  // ------------------------------------------------------------
  chartTexture(key, green) {
    return this.canvasTex(key, 128, 80, (c, w, h) => {
      c.fillStyle = '#04120a'; c.fillRect(0, 0, w, h);
      c.strokeStyle = 'rgba(0,255,136,0.12)';
      for (let y = 10; y < h; y += 14) { c.beginPath(); c.moveTo(0, y); c.lineTo(w, y); c.stroke(); }
      let p = h * 0.6;
      for (let x = 4; x < w - 4; x += 9) {
        const o = p; p = Math.max(8, Math.min(h - 8, p + (Math.random() - (green ? 0.62 : 0.38)) * 16));
        const up = p < o;
        c.fillStyle = up ? '#00DD77' : '#EE3344';
        c.fillRect(x + 3, Math.min(p, o) - 4, 1, Math.abs(p - o) + 8);
        c.fillRect(x, Math.min(p, o), 7, Math.max(2, Math.abs(p - o)));
      }
    }, { repeat: false });
  }

  buildTradingFloor(level) {
    const T = THREE;
    const gd = this.groundDepth();
    const ZB = -3000, CEIL = -380;
    this.floor(this.x0, this.x1, W3D_GROUND_Y + 2, -gd, ZB, this.groundMaterials()[2], 128);
    // Ceiling with light panels
    const ceilTex = this.canvasTex('ceilPanels', 128, 128, (c, w, h) => {
      c.fillStyle = '#000'; c.fillRect(0, 0, w, h);
      c.fillStyle = '#ffe2b0'; c.fillRect(24, 24, 80, 80);
    });
    const ceil = this.floor(this.x0, this.x1, CEIL, -gd, ZB, this.mat('ceiling', {
      color: 0x2a1c10, emissive: 0xffe6c0, emissiveMap: ceilTex, emissiveIntensity: 0.55, roughness: 0.8, side: T.DoubleSide,
    }), 260);
    ceil.rotation.x = Math.PI / 2;

    // Back wall: wood panels with giant screens and a ticker
    const wallTex = this.canvasTex('wallPanels', 128, 128, (c, w, h) => {
      c.fillStyle = '#3a2414'; c.fillRect(0, 0, w, h);
      c.strokeStyle = '#5a3a20'; c.lineWidth = 4; c.strokeRect(6, 6, w - 12, h - 12);
    });
    this.wall(this.x0, this.x1, CEIL, W3D_GROUND_Y + 2, ZB, this.mat('backWall', { map: wallTex, roughness: 0.7 }), 160, 160);
    const screens = [this.chartTexture('chartG1', true), this.chartTexture('chartG2', true), this.chartTexture('chartR1', false)];
    const screenMats = screens.map(s => new T.MeshBasicMaterial({ map: s, toneMapped: false }));
    for (let x = this.x0 + 300; x < this.x1; x += 900) {
      const sm = screenMats[Math.floor(this.rng() * screenMats.length)];
      const s = new T.Mesh(new T.PlaneGeometry(520, 320), sm);
      s.position.set(x, -(W3D_GROUND_Y - 520), ZB + 4);
      const frame = new T.Mesh(new T.BoxGeometry(540, 340, 6), this.mat('screenFrame', { color: 0x111118, metalness: 0.7, roughness: 0.3 }));
      frame.position.set(x, -(W3D_GROUND_Y - 520), ZB + 2);
      this.root.add(frame, s);
    }
    const tickTex = this.tickerTexture(level.tickerStocks);
    tickTex.repeat.set(4, 1);
    const band = new T.Mesh(new T.PlaneGeometry(this.x1 - this.x0, 70), new T.MeshBasicMaterial({ map: tickTex, toneMapped: false }));
    band.position.set((this.x0 + this.x1) / 2, -(W3D_GROUND_Y - 820), ZB + 6);
    this.root.add(band);
    this.tickers.push(t => { tickTex.offset.x = (t * 0.05) % 1; });

    // Marble columns floor-to-ceiling
    const colMats = this.platformMats('column');
    const colH = W3D_GROUND_Y - CEIL;
    for (const z of [-800, -1900]) {
      for (let x = this.x0 + (z === -800 ? 0 : 260); x < this.x1; x += 560) {
        this.mergeAdd(colMats.shaft, new T.CylinderGeometry(34, 38, colH, 20).translate(x, -(W3D_GROUND_Y - colH / 2), z),
          null, { cast: z === -800, receive: true });
        this.mergeAdd(colMats.cap, new T.BoxGeometry(96, 24, 96).translate(x, -(W3D_GROUND_Y - 12), z));
        this.mergeAdd(colMats.cap, new T.BoxGeometry(96, 24, 96).translate(x, -(CEIL + 12), z));
      }
    }

    // Trading desks with glowing monitors
    const deskMat = this.mat('tradeDesk', { color: 0x3a2618, roughness: 0.5 });
    const bezel = this.mat('bezel', { color: 0x111118, metalness: 0.6, roughness: 0.3 });
    const monMats = screens.map(s => new T.MeshBasicMaterial({ map: s, toneMapped: false }));
    for (let x = this.x0; x < this.x1; x += 220 + this.rng() * 200) {
      const z = -gd - 140 - this.rng() * 1500;
      this.mergeAdd(deskMat, new T.BoxGeometry(170, 44, 70).translate(x, -(W3D_GROUND_Y - 22), z), null, { receive: true });
      const n = 2 + Math.floor(this.rng() * 2);
      for (let i = 0; i < n; i++) {
        const mon = new T.BoxGeometry(46, 30, 4)
          .rotateY((i - (n - 1) / 2) * -0.15)
          .translate(x - (n - 1) * 26 + i * 52, -(W3D_GROUND_Y - 44 - 22), z - 16);
        this.mergeAdd(monMats[Math.floor(this.rng() * monMats.length)], mon.clone(), [4]);
        this.mergeAdd(bezel, mon, [0, 1, 2, 3, 5]);
      }
    }
  }

  // ------------------------------------------------------------
  //  Theme: Crypto Mines
  // ------------------------------------------------------------
  buildCryptoMines(level) {
    const T = THREE;
    const gd = this.groundDepth();
    const ZB = -2600, CEIL = -300;
    const rockTex = this.canvasTex('caveRock', 256, 256, (c, w, h) => {
      c.fillStyle = '#1a1230'; c.fillRect(0, 0, w, h);
      this.noise(c, w, h, 2500, ['#241a40', '#120c22', '#2c2050'], 5);
    });
    const rock = this.mat('caveRock', { map: rockTex, roughness: 1 });
    this.floor(this.x0, this.x1, W3D_GROUND_Y + 2, -gd, ZB, rock, 256);
    const ceil = this.floor(this.x0, this.x1, CEIL, -gd, ZB, this.mat('caveCeil', { map: rockTex, roughness: 1, side: T.DoubleSide }), 256);
    ceil.rotation.x = Math.PI / 2;

    // Back wall: matrix rain scrolling down a dark rock face
    const matrix = this.canvasTex('matrix', 256, 512, (c, w, h) => {
      c.fillStyle = '#000'; c.fillRect(0, 0, w, h);
      c.font = 'bold 14px monospace';
      for (let x = 0; x < w; x += 14) {
        const len = 6 + Math.floor(Math.random() * 18);
        const y0 = Math.random() * h;
        for (let j = 0; j < len; j++) {
          c.fillStyle = j === len - 1 ? '#bbffcc' : 'rgba(0,200,80,' + (0.15 + j / len * 0.6) + ')';
          c.fillText(String.fromCharCode(0x30 + Math.floor(Math.random() * 10)), x, (y0 + j * 16) % h);
        }
      }
    });
    const wallMat = this.mat('matrixWall', { map: rockTex, emissive: 0xffffff, emissiveMap: matrix, emissiveIntensity: 1, roughness: 1 });
    this.wall(this.x0, this.x1, CEIL, W3D_GROUND_Y + 2, ZB, wallMat, 512, 1024);
    this.tickers.push(t => { matrix.offset.y = (t * 0.08) % 1; });

    // Stalactites
    const stalMat = this.mat('stal', { color: 0x2a1a50, roughness: 0.9, flatShading: true });
    const tipGlows = [];
    for (let i = 0; i < (this.x1 - this.x0) / 110; i++) {
      const x = this.x0 + this.rng() * (this.x1 - this.x0);
      const z = -gd - 60 - this.rng() * 2000;
      const len = 80 + this.rng() * 320;
      this.mergeAdd(stalMat, new T.ConeGeometry(14 + this.rng() * 30, len, 6).rotateX(Math.PI).translate(x, -(CEIL + len / 2), z));
      if (this.rng() < 0.25) {
        const g = this.glow('#9a44ff', 40, 0.6);
        g.position.set(x, -(CEIL + len), z);
        this.root.add(g);
        tipGlows.push(g);
      }
    }

    // Server rack rows with blinking LEDs (three materials, out of phase)
    const ledTex = this.canvasTex('rackLeds', 64, 128, (c, w, h) => {
      c.fillStyle = '#000'; c.fillRect(0, 0, w, h);
      for (let y = 6; y < h; y += 10) {
        c.fillStyle = '#1a1a3a'; c.fillRect(4, y - 3, w - 8, 8);
        c.fillStyle = Math.random() > 0.5 ? '#00FFCC' : '#FF00FF';
        c.fillRect(8, y, 4, 2); c.fillRect(w - 12, y, 4, 2);
        if (Math.random() > 0.5) { c.fillStyle = '#00CCFF'; c.fillRect(18, y, 3, 2); }
      }
    });
    const rackMats = [0, 1, 2].map(i => new T.MeshStandardMaterial({ color: 0x0c0c1e, metalness: 0.6, roughness: 0.35,
      emissive: 0xffffff, emissiveMap: ledTex, emissiveIntensity: 1.5 }));
    const rackSide = this.mat('rackSide', { color: 0x10102a, metalness: 0.6, roughness: 0.4 });
    for (const z of [-700, -1300, -1950]) {
      for (let x = this.x0; x < this.x1; x += 70 + this.rng() * 140) {
        const w = 50 + this.rng() * 50, h = 160 + this.rng() * 300;
        const geo = this.boxGeo(w, h, 70, 0);
        const uv = geo.attributes.uv;
        for (let k = 16; k < 20; k++) uv.setXY(k, uv.getX(k) * w / 64, uv.getY(k) * h / 128);
        const fm = rackMats[Math.floor(this.rng() * 3)];
        geo.translate(x, -(W3D_GROUND_Y - h / 2), z);
        const sh = { cast: z === -700, receive: z === -700 };
        this.mergeAdd(fm, geo.clone(), [4], sh);
        this.mergeAdd(rackSide, geo, [0, 1, 2, 3, 5], sh);
      }
    }

    // Glowing crystal clusters
    const crystalMats = [
      new T.MeshStandardMaterial({ color: 0x9a30ff, emissive: 0x7a10ff, emissiveIntensity: 0.9, roughness: 0.1, flatShading: true, transparent: true, opacity: 0.9 }),
      new T.MeshStandardMaterial({ color: 0x30e0ff, emissive: 0x10a0ff, emissiveIntensity: 0.9, roughness: 0.1, flatShading: true, transparent: true, opacity: 0.9 }),
    ];
    const crystals = [];
    for (let x = this.x0; x < this.x1; x += 260 + this.rng() * 400) {
      const z = -gd - 80 - this.rng() * 1200;
      const cm = crystalMats[Math.floor(this.rng() * 2)];
      const n = 3 + Math.floor(this.rng() * 4);
      for (let i = 0; i < n; i++) {
        const s = 14 + this.rng() * 22;
        const sy = 2 + this.rng() * 1.5;
        const c = new T.OctahedronGeometry(s, 0).scale(1, sy, 1)
          .rotateY(this.rng() * 3).rotateZ((this.rng() - 0.5) * 0.6).rotateX((this.rng() - 0.5) * 0.6)
          .translate(x + (this.rng() - 0.5) * 60, -(W3D_GROUND_Y + 2) + s * sy * 0.6, z + (this.rng() - 0.5) * 40);
        this.mergeAdd(cm, c, null, { cast: true });
      }
      const gl = this.glow(cm === crystalMats[0] ? '#aa44ff' : '#33ccff', 220, 0.45);
      gl.position.set(x, -(W3D_GROUND_Y + 2) + 40, z);
      this.root.add(gl);
      crystals.push({ gl, phase: this.rng() * 6 });
    }

    // Floating crypto coins
    const coinFace = (key, sym, col) => this.canvasTex(key, 128, 128, (c, w, h) => {
      c.fillStyle = col; c.beginPath(); c.arc(w / 2, h / 2, w / 2, 0, Math.PI * 2); c.fill();
      c.strokeStyle = 'rgba(255,255,255,0.6)'; c.lineWidth = 6; c.beginPath(); c.arc(w / 2, h / 2, w / 2 - 10, 0, Math.PI * 2); c.stroke();
      c.fillStyle = '#ffffff'; c.font = 'bold 72px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(sym, w / 2, h / 2 + 4);
    }, { repeat: false });
    const coinDefs = [['coinBTC', '₿', '#F7931A'], ['coinETH', 'Ξ', '#627EEA'], ['coinDOGE', 'Ð', '#C3A634']];
    const coinMats = coinDefs.map(([k, s, col]) => {
      const face = new T.MeshStandardMaterial({ map: coinFace(k, s, col), metalness: 0.7, roughness: 0.3, emissive: col, emissiveIntensity: 0.25 });
      const edge = new T.MeshStandardMaterial({ color: col, metalness: 0.8, roughness: 0.3 });
      return [edge, face, face];
    });
    const coins = [];
    for (let x = this.x0; x < this.x1; x += 350 + this.rng() * 450) {
      const m = new T.Mesh(new T.CylinderGeometry(24, 24, 5, 32), coinMats[Math.floor(this.rng() * 3)]);
      m.rotation.x = Math.PI / 2;
      const holder = new T.Group();
      holder.add(m);
      holder.position.set(x, -(W3D_GROUND_Y - 200 - this.rng() * 260), -gd - 150 - this.rng() * 1100);
      this.root.add(holder);
      coins.push({ holder, baseY: holder.position.y, phase: this.rng() * 6 });
    }

    this.tickers.push(t => {
      for (let i = 0; i < 3; i++) rackMats[i].emissiveIntensity = Math.sin(t * 3 + i * 2.1) > -0.3 ? 1.6 : 0.5;
      for (const c of crystals) c.gl.material.opacity = 0.35 + Math.sin(t * 1.5 + c.phase) * 0.15;
      for (const c of coins) {
        c.holder.rotation.y = t * 1.2 + c.phase;
        c.holder.position.y = c.baseY + Math.sin(t * 0.8 + c.phase) * 14;
      }
    });
  }
}

// Death/respawn state
let deathPauseTimer = 0;
let marginCallShown = false;
let flashCrashTimer = 0;

// Grizzly stomp combo tracking
let grizzlyComboTarget = null;

// Stock ticker refresh
let lastStockFetchTime = 0;
const STOCK_FETCH_INTERVAL = 60; // seconds

// Market crash event
let marketCrashActive = false;
let marketCrashTimer = 0;
let marketCrashShakeOffset = { x: 0, y: 0 };
let diamondSpawnTimer = 0;
let diamondSpawnDelay = 35 + Math.random() * 20;
let dhTickTimer = 0;

// Level system
let currentLevelIndex = 0;
let goalLockedHintTimer = 0;

// Pause (P / Esc, auto-pauses when the tab is hidden)
let gamePaused = false;
document.addEventListener('visibilitychange', () => {
  if (document.hidden && currentState === GameState.PLAYING) gamePaused = true;
});

// ==========================================
//  Canvas setup
// ==========================================
function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function getScale() {
  const scaleX = canvas.width / CONFIG.VIRTUAL_WIDTH;
  const scaleY = canvas.height / CONFIG.VIRTUAL_HEIGHT;
  return Math.min(scaleX, scaleY);
}

// ==========================================
//  Game Start
// ==========================================
function startGame(characterType, levelIndex) {
  currentLevelIndex = levelIndex || 0;
  const LEVELS = [LEVEL_SPACEX, LEVEL_1, LEVEL_2, LEVEL_3];
  const levelData = LEVELS[currentLevelIndex];
  level = loadLevel(levelData);
  player = new Player(levelData.playerStart.x, levelData.playerStart.y, characterType);
  camera = new Camera(CONFIG.VIRTUAL_WIDTH, CONFIG.VIRTUAL_HEIGHT);
  camera.levelWidth = level.width;
  camera.levelHeight = level.height;
  background = new BackgroundRenderer(levelData.theme || 'nightCity');
  hud = new HUD(level.tickerStocks);
  levelTime = 0;
  totalRunTime = 0;
  deathPauseTimer = 0;
  marginCallShown = false;
  leaderboardPending = false;
  grizzlyComboTarget = null;
  marketCrashActive = false;
  marketCrashTimer = 0;
  marketCrashShakeOffset = { x: 0, y: 0 };
  diamondSpawnTimer = 0;
  diamondSpawnDelay = 35 + Math.random() * 20;
  dhTickTimer = 0;
  flashCrashTimer = 0;
  gamePaused = false;
  leaderboard.resetSession();

  // Wire up question block callbacks
  for (const block of level.questionBlocks) {
    block.setHitCallback((contents, x, y) => {
      spawnFromBlock(contents, x, y);
      audio.playBlockHit();
    });
  }

  currentState = GameState.PLAYING;

  // Try to fetch live stock data
  fetchLiveStockData().then(stocks => {
    if (stocks) {
      level.tickerStocks = stocks;
      hud.tickerStocks = stocks;
    }
  });
}

function spawnFromBlock(contents, x, y) {
  let item;
  if (contents === 'bull') {
    item = new GoldBull(x, y);
  } else if (contents === 'hodlItem') {
    item = new HodlItem(x, y);
  } else if (contents === 'greenCandle') {
    item = new GreenCandle(x, y);
  }
  if (item) {
    item.fromBlock = true;
    item.vy = -200; // Pop upward
    level.collectibles.push(item);
  }
}

// ==========================================
//  Main Update
// ==========================================
function update(dt) {
  gameTime += dt;

  // Debug mode toggle
  if (input.wasPressed('F1') || input.wasPressed('Backquote')) {
    debugMode = !debugMode;
  }

  // Mute toggle (M) works everywhere
  if (input.wasPressed('KeyM')) audio.toggleMute();

  if (currentState === GameState.PLAYING) {
    if (input.wasPressed('KeyP') || input.wasPressed('Escape')) {
      gamePaused = !gamePaused;
    } else if (gamePaused && (input.wasPressed('Enter') || input.wasPressed('Space'))) {
      gamePaused = false; // also resumes from a touch tap
    }
    if (gamePaused) {
      input.clearFrameState();
      touchControls.update(dt, currentState);
      return;
    }
  }

  switch (currentState) {
    case GameState.TITLE:
      updateTitle(dt);
      break;
    case GameState.PLAYING:
      updatePlaying(dt);
      break;
    case GameState.GAME_OVER:
      updateGameOver(dt);
      break;
    case GameState.LEVEL_COMPLETE:
      updateLevelComplete(dt);
      break;
  }

  input.clearFrameState();
  touchControls.update(dt, currentState);
}

function updateTitle(dt) {
  const result = titleScreen.update(dt, input);
  if (result === 'start') {
    audio.init();
    audio.playBackgroundMusic();
    startGame(titleScreen.selectedCharacter);
  }
}

function updatePlaying(dt) {
  // Handle death pause
  if (deathPauseTimer > 0) {
    deathPauseTimer -= dt;
    if (player.deathAnimating) {
      player.update(dt, { left: false, right: false, jump: false }, []);
    }
    if (deathPauseTimer <= 0) {
      if (player.lives <= 0) {
        audio.stopBackgroundMusic();
        gameOverScreen = new GameOverScreen();
        gameOverScreen.finalScore = player.score;
        gameOverScreen.bullsCollected = player.totalBullsCollected;
        currentState = GameState.GAME_OVER;
        triggerLeaderboard(player.score, player.totalBullsCollected, totalRunTime, player.characterType);
      } else {
        player.respawn();
        camera.x = Math.max(0, player.x - CONFIG.VIRTUAL_WIDTH / 2);
        marginCallShown = false;
      }
    }
    particles.update(dt);
    floatingText.update(dt);
    return;
  }

  levelTime += dt;
  totalRunTime += dt;

  // Update flash crash timer (death effect)
  if (flashCrashTimer > 0) {
    flashCrashTimer -= dt;
  }

  // Periodic stock ticker refresh
  lastStockFetchTime += dt;
  if (lastStockFetchTime >= STOCK_FETCH_INTERVAL) {
    lastStockFetchTime = 0;
    fetchLiveStockData().then(stocks => {
      if (stocks && level && hud) {
        const oldStocks = level.tickerStocks;
        for (const newStock of stocks) {
          const old = oldStocks.find(s => s.symbol === newStock.symbol);
          if (old && old.price !== newStock.price) {
            newStock._flash = newStock.price > old.price ? 'green' : 'red';
            newStock._flashTimer = 2.0;
          }
        }
        level.tickerStocks = stocks;
        hud.tickerStocks = stocks;
      }
    });
  }

  // Update player
  player.update(dt, input, level.solids);

  // Landing and running dust
  if (player.landedThisFrame && player.landingImpact > 350) {
    particles.dust(player.x + player.width / 2, player.y + player.height,
      Math.min(12, Math.round(player.landingImpact / 90)));
  }
  runDustTimer += dt;
  if (player.onGround && Math.abs(player.vx) > 200 && runDustTimer > 0.18) {
    runDustTimer = 0;
    particles.dust(player.x + (player.facingRight ? 6 : player.width - 6),
      player.y + player.height - 2, 2);
  }

  // Rocket exhaust sparks while launching off a Short Squeeze pad
  if (player.rocketBoostTimer > 0) {
    particles.rocketBoost(player.x + player.width / 2, player.y + player.height);
  }

  // Grizzly stomp combo: reset if player touches ground
  if (grizzlyComboTarget && player.onGround) {
    if (grizzlyComboTarget.alive) {
      grizzlyComboTarget.stunned = false;
      floatingText.spawn(grizzlyComboTarget.x + grizzlyComboTarget.width / 2,
        grizzlyComboTarget.y - 20, 'UNSTUNNED!', '#FF8800', 16);
    }
    grizzlyComboTarget = null;
  }

  // Jump sounds
  if (player.superJumpedThisFrame) {
    audio.playSuperJump();
  } else if (player.jumpedThisFrame) {
    audio.playJump();
  }

  // Update question blocks
  for (const block of level.questionBlocks) {
    block.update(dt);
  }

  // Update enemies — only once they come within ~1.5 screens of the camera,
  // so distant enemies hold their patrol positions until the player approaches
  const enemyWakeLeft = camera.x - CONFIG.VIRTUAL_WIDTH * 0.5;
  const enemyWakeRight = camera.x + CONFIG.VIRTUAL_WIDTH * 1.5;
  for (let i = level.enemies.length - 1; i >= 0; i--) {
    const enemy = level.enemies[i];
    if (!enemy.awake) {
      if (enemy.x + enemy.width > enemyWakeLeft && enemy.x < enemyWakeRight) {
        enemy.awake = true;
      } else {
        continue;
      }
    }
    const keepAlive = enemy instanceof GrizzlyBear
      ? enemy.update(dt, level.solids, player.x)
      : enemy.update(dt, level.solids);
    if (!keepAlive) {
      level.enemies.splice(i, 1);
    }
  }

  // Player vs enemies collision
  if (!player.deathAnimating) {
    for (const enemy of level.enemies) {
      if (player.deathAnimating) break; // already died this frame
      if (!enemy.alive) continue;
      if (!aabbOverlap(player, enemy)) continue;

      // Check if Diamond Hands invincible - kill ALL enemies on contact
      if (player.invincible && player.diamondHands) {
        enemy.hp = 0;
        enemy.alive = false;
        particles.bearDeath(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2);
        floatingText.spawn(enemy.x + enemy.width / 2, enemy.y - 20, '+200', CONFIG.COLORS.BULL_GOLD);
        player.score += 200;
        audio.playStomp();
        continue;
      }

      // Determine stomp vs side hit
      const playerBottom = player.y + player.height;
      const enemyTop = enemy.y;
      const playerFalling = player.vy > 0;

      if (playerFalling && (playerBottom - enemyTop) < enemy.height * 0.45) {
        if (enemy instanceof GrizzlyBear) {
          // Grizzly: requires 2 stomps without touching ground
          const killed = enemy.stomp();
          if (killed) {
            // Second stomp — grizzly defeated!
            player.vy = CONFIG.PLAYER_STOMP_BOUNCE;
            grizzlyComboTarget = null;
            particles.bearDeath(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2);
            floatingText.spawn(enemy.x + enemy.width / 2, enemy.y - 20, '+500', CONFIG.COLORS.BULL_GOLD, 22);
            player.score += 500;
            audio.playStomp();
          } else {
            // First stomp — high bounce, must land again without touching ground
            player.vy = -500; // Higher bounce for combo opportunity
            grizzlyComboTarget = enemy;
            enemy.stunned = true;
            floatingText.spawn(enemy.x + enemy.width / 2, enemy.y - 20, 'STOMP AGAIN!', '#FF8800', 18);
            player.score += 50;
            audio.playGrizzlyStomp();
          }
        } else {
          // STOMP baby bears
          const killed = enemy.stomp();
          player.vy = CONFIG.PLAYER_STOMP_BOUNCE;
          audio.playStomp();

          if (killed) {
            particles.bearDeath(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2);
            floatingText.spawn(enemy.x + enemy.width / 2, enemy.y - 20, '+200', CONFIG.COLORS.BULL_GOLD);
            player.score += 200;
          } else {
            floatingText.spawn(enemy.x + enemy.width / 2, enemy.y - 20, 'HIT!', CONFIG.COLORS.TICKER_RED, 18);
            player.score += 50;
          }
        }
      } else {
        // Side hit - player takes damage
        const died = player.takeDamage();
        if (died) {
          playerDeath('enemy');
        } else {
          audio.playDamage();
          floatingText.spawn(player.x + player.width / 2, player.y - 20, 'OUCH!', CONFIG.COLORS.TICKER_RED, 20);
          // Knockback
          player.vx = (player.x < enemy.x) ? -200 : 200;
          player.vy = -200;
        }
      }
    }
  }

  // Player vs collectibles
  for (let i = level.collectibles.length - 1; i >= 0; i--) {
    const c = level.collectibles[i];
    if (c.collected || c.type === 'redCandle') continue; // hazards are handled below
    if (!aabbOverlap(player, c)) continue;

    c.collected = true;

    if (c.type === 'bull') {
      const result = player.collectBull();
      audio.playCollect();
      particles.bullCollect(c.x + c.width / 2, c.y + c.height / 2);
      floatingText.spawn(c.x + c.width / 2, c.y - 10, '+$100', CONFIG.COLORS.BULL_GOLD, 16);
      if (result === 'diamondHands') {
        audio.playDiamondHands();
        floatingText.spawn(player.x + player.width / 2, player.y - 40,
          'DIAMOND HANDS!', '#88DDFF', 28, 2.5);
        particles.powerUp(player.x + player.width / 2, player.y + player.height / 2, '#88DDFF');
      }
    } else if (c.type === 'hodlItem') {
      player.applyPowerUp('hodlItem');
      audio.playPowerUp();
      particles.powerUp(c.x + c.width / 2, c.y + c.height / 2, '#FF4444');
      floatingText.spawn(c.x + c.width / 2, c.y - 10, 'HODL!', '#FF4444', 22, 1.5);
    } else if (c.type === 'greenCandle') {
      player.applyPowerUp('greenCandle');
      audio.playPowerUp();
      particles.powerUp(c.x + c.width / 2, c.y + c.height / 2, CONFIG.COLORS.GREEN_CANDLE);
      floatingText.spawn(c.x + c.width / 2, c.y - 10, 'GREEN CANDLE!', CONFIG.COLORS.GREEN_CANDLE, 22, 1.5);
    } else if (c.type === 'dividend') {
      player.score += CONFIG.DIVIDEND_SCORE;
      audio.playDividend();
      particles.bullCollect(c.x + c.width / 2, c.y + c.height / 2);
      floatingText.spawn(c.x + c.width / 2, c.y - 10, '+$500 DIVIDEND!', '#00FF88', 24, 2.0);
    } else if (c.type === 'runningDiamond') {
      audio.playDiamondCollect();
      audio.playDiamondHands();
      player.activateDiamondHands();
      particles.powerUp(player.x + player.width / 2, player.y + player.height / 2, '#88DDFF');
      floatingText.spawn(player.x + player.width / 2, player.y - 40,
        'DIAMOND HANDS!', '#88DDFF', 28, 2.5);
    }
  }

  // Remove collected items
  level.collectibles = level.collectibles.filter(c => !c.collected);

  // Short Squeeze pads
  for (const pad of level.shortSqueezePads) {
    pad.update(dt);
    if (!player.deathAnimating && pad.tryLaunch(player)) {
      audio.playSuperJump();
      floatingText.spawn(pad.x + pad.width / 2, pad.y - 20, 'SHORT SQUEEZE!', '#00FF88', 20, 1.5);
      particles.powerUp(pad.x + pad.width / 2, pad.y, '#00FF88');
    }
  }

  // Checkpoints — touching one moves the respawn point
  for (const cp of level.checkpoints) {
    cp.update(dt);
    if (!cp.activated && !player.deathAnimating && aabbOverlap(player, cp)) {
      cp.activate();
      player.spawnX = cp.x + cp.width / 2 - CONFIG.PLAYER_WIDTH / 2;
      player.spawnY = cp.y + cp.height - CONFIG.PLAYER_HEIGHT - 2;
      audio.playCheckpoint();
      floatingText.spawn(cp.x + cp.width / 2, cp.y - 16, 'CHECKPOINT!', '#00FF88', 22, 2.0);
      particles.powerUp(cp.x + cp.width / 2, cp.y + cp.height / 2, '#00FF88');
    }
  }

  // Update moving platforms
  if (level.movingPlatforms) {
    for (const mp of level.movingPlatforms) {
      const oldX = mp.x;
      const oldY = mp.y;
      mp.update(dt);
      // Carry player if standing on this platform
      if (player.onGround && !player.deathAnimating) {
        const onPlatform = player.y + player.height >= mp.y - 2 &&
                           player.y + player.height <= mp.y + 4 &&
                           player.x + player.width > mp.x &&
                           player.x < mp.x + mp.width;
        if (onPlatform) {
          player.x += (mp.x - oldX);
          player.y += (mp.y - oldY);
          // Transfer platform velocity to player for better jump behavior off moving platforms
          player._platformVx = mp.vx;
          player._platformVy = mp.vy;
        }
      }
    }
  }

  // Market crash events
  if (level.marketCrashZones && !marketCrashActive) {
    for (const zone of level.marketCrashZones) {
      if (!zone.triggered && Math.abs(player.x - zone.x) < 50) {
        zone.triggered = true;
        marketCrashActive = true;
        marketCrashTimer = 5.0; // 5 seconds
        audio.playMarketCrash();
        floatingText.spawn(player.x + player.width / 2, player.y - 60,
          'MARKET CRASH!', CONFIG.COLORS.TICKER_RED, 36, 3.0);
      }
    }
  }
  if (marketCrashActive) {
    marketCrashTimer -= dt;
    // Fade shake intensity as crash nears end
    const crashIntensity = Math.min(1, marketCrashTimer / 1.0); // Fade in last second
    marketCrashShakeOffset.x = (Math.random() - 0.5) * 6 * crashIntensity;
    marketCrashShakeOffset.y = (Math.random() - 0.5) * 4 * crashIntensity;
    // Speed up all enemies during crash (applied every frame to catch newly alive enemies)
    for (const enemy of level.enemies) {
      if (enemy.alive) enemy.crashSpeedMult = 1.5;
    }
    if (marketCrashTimer <= 0) {
      marketCrashActive = false;
      marketCrashShakeOffset = { x: 0, y: 0 };
      // Reset ALL enemies' speed multiplier (including any that were spawned during crash)
      for (const enemy of level.enemies) {
        enemy.crashSpeedMult = 1.0;
      }
    }
  } else {
    // Safety: ensure no lingering crash speed multiplier on enemies when crash is inactive
    // This handles edge cases where enemies could retain the multiplier
  }

  // Red Candle falling hazards
  level.redCandleTimer = (level.redCandleTimer || 0) + dt;
  if (level.redCandleTimer >= 2.0) {
    level.redCandleTimer = 0;
    for (const zone of level.redCandleZones) {
      // Only spawn if player is within range of the zone
      if (Math.abs(player.x - zone.x - zone.width / 2) < CONFIG.VIRTUAL_WIDTH) {
        const rx = zone.x + Math.random() * zone.width;
        level.collectibles.push(new RedCandle(rx, player.y - CONFIG.VIRTUAL_HEIGHT / 2 - 50));
      }
    }
  }

  // Player vs red candles
  for (let i = level.collectibles.length - 1; i >= 0; i--) {
    const c = level.collectibles[i];
    if (c.type !== 'redCandle' || c.collected) continue;
    if (!player.deathAnimating && aabbOverlap(player, c)) {
      c.collected = true;
      const died = player.takeDamage();
      if (died) {
        playerDeath('enemy');
      } else {
        audio.playDamage();
        floatingText.spawn(player.x + player.width / 2, player.y - 20, 'RED CANDLE!', '#FF4444', 20);
        player.vx = (player.x < c.x) ? -150 : 150;
        player.vy = -150;
      }
    }
  }

  // Spawn running diamond every 35-55 seconds
  diamondSpawnTimer += dt;
  if (diamondSpawnTimer >= diamondSpawnDelay) {
    diamondSpawnTimer = 0;
    diamondSpawnDelay = 35 + Math.random() * 20;
    // Spawn from right side of screen, bouncing left toward player
    const spawnX = player.x + CONFIG.VIRTUAL_WIDTH + 40;
    const spawnY = 380;
    level.collectibles.push(new RunningDiamond(spawnX, spawnY, -1));
    floatingText.spawn(player.x + CONFIG.VIRTUAL_WIDTH / 2, player.y - 20,
      '\u25C6 DIAMOND!', '#88DDFF', 20, 1.5);
  }

  // Diamond Hands accelerating tick sound
  if (player.diamondHands && player.invincibleTimer > 0) {
    const remaining = player.invincibleTimer;
    const total = CONFIG.DIAMOND_HANDS_DURATION;
    const ratio = remaining / total;
    // Tick interval decreases as time runs out
    let interval;
    if (remaining > 7) interval = 0.7;
    else if (remaining > 5) interval = 0.45;
    else if (remaining > 3) interval = 0.25;
    else if (remaining > 1.5) interval = 0.12;
    else interval = 0.06;
    dhTickTimer += dt;
    if (dhTickTimer >= interval) {
      dhTickTimer = 0;
      audio.playDiamondHandsTick(ratio);
    }
  } else {
    dhTickTimer = 0;
  }

  // Boss update and collision
  if (level.boss) {
    const boss = level.boss;
    if (boss.alive) {
      boss.update(dt, level.solids, player.x);

      // Player vs boss collision
      if (!player.deathAnimating && aabbOverlap(player, boss)) {
        if (player.invincible && player.diamondHands) {
          // Diamond hands deals 1 damage
          const killed = boss.stomp();
          player.vy = CONFIG.PLAYER_STOMP_BOUNCE;
          audio.playStomp();
          if (killed) {
            audio.playBossDeath();
            floatingText.spawn(boss.x + boss.width / 2, boss.y - 30, '+2000 WHALE DOWN!', CONFIG.COLORS.BULL_GOLD, 28, 3.0);
            player.score += 2000;
          }
        } else {
          const playerBottom = player.y + player.height;
          const bossTop = boss.y;
          const playerFalling = player.vy > 0;

          if (playerFalling && (playerBottom - bossTop) < boss.height * 0.35) {
            // Stomp the boss
            const killed = boss.stomp();
            player.vy = -500; // High bounce
            audio.playGrizzlyStomp();
            if (killed) {
              audio.playBossDeath();
              floatingText.spawn(boss.x + boss.width / 2, boss.y - 30, '+2000 WHALE DOWN!', CONFIG.COLORS.BULL_GOLD, 28, 3.0);
              player.score += 2000;
            } else {
              floatingText.spawn(boss.x + boss.width / 2, boss.y - 20, 'HIT! ' + boss.hp + '/' + boss.maxHp, '#FF8800', 20);
              player.score += 100;
              if (boss.phase === 2 && boss.hp === 6) {
                audio.playBossRoar();
                floatingText.spawn(boss.x + boss.width / 2, boss.y - 50, 'PHASE 2!', '#FF4444', 24, 2.0);
              } else if (boss.phase === 3 && boss.hp === 3) {
                audio.playBossRoar();
                floatingText.spawn(boss.x + boss.width / 2, boss.y - 50, 'FINAL PHASE!', '#FF0000', 28, 2.0);
              }
            }
          } else if (!boss.stunned) {
            // Side hit — player takes damage
            const died = player.takeDamage();
            if (died) {
              playerDeath('enemy');
            } else {
              audio.playDamage();
              floatingText.spawn(player.x + player.width / 2, player.y - 20, 'OUCH!', CONFIG.COLORS.TICKER_RED, 20);
              player.vx = (player.x < boss.x) ? -250 : 250;
              player.vy = -250;
            }
          }
        }
      }

      // Player vs boss shockwaves
      if (!player.deathAnimating) {
        for (const sw of boss.shockwaves) {
          const dist = Math.abs(player.x + player.width / 2 - sw.x);
          const playerOnGround = player.y + player.height >= 430; // Ground is at y=432, use 430 for 2px tolerance
          if (playerOnGround && dist < sw.radius + 20 && dist > sw.radius - 20) {
            const died = player.takeDamage();
            if (died) {
              playerDeath('enemy');
            } else {
              audio.playBossShockwave();
              player.vy = -300;
              player.vx = (player.x < sw.x) ? -200 : 200;
              floatingText.spawn(player.x + player.width / 2, player.y - 20, 'SHOCKWAVE!', '#FFAA00', 18);
            }
            break;
          }
        }
      }

      // Player vs boss projectiles
      if (!player.deathAnimating) {
        for (let i = boss.projectiles.length - 1; i >= 0; i--) {
          const p = boss.projectiles[i];
          if (aabbOverlap(player, p)) {
            boss.projectiles.splice(i, 1);
            const died = player.takeDamage();
            if (died) {
              playerDeath('enemy');
            } else {
              audio.playDamage();
              floatingText.spawn(player.x + player.width / 2, player.y - 20, 'RED CANDLE!', '#FF4444', 20);
              player.vy = -150;
            }
            break;
          }
        }
      }

      // Boss arena walls — confine player
      if (level.bossArena && boss.activated && !player.deathAnimating) {
        if (player.x < level.bossArena.wallLeft) {
          player.x = level.bossArena.wallLeft;
          player.vx = 0;
        }
        if (player.x + player.width > level.bossArena.wallRight) {
          player.x = level.bossArena.wallRight - player.width;
          player.vx = 0;
        }
      }
    }
  }

  // Clamp player to level boundaries (left and right edges)
  if (player.x < 0) {
    player.x = 0;
    player.vx = 0;
  }
  if (player.x + player.width > level.width) {
    player.x = level.width - player.width;
    player.vx = 0;
  }

  // Pit death
  if (!player.deathAnimating && player.y > CONFIG.VIRTUAL_HEIGHT + 50) {
    playerDeath('pit');
  }

  // Goal check
  const goal = level.goalPosition;
  const atGoal = !player.deathAnimating &&
      Math.abs(player.x + player.width / 2 - goal.x - 24) < 50 &&
      Math.abs(player.y + player.height / 2 - goal.y - 20) < 50;
  const bossBlocking = level.boss && level.boss.alive;
  if (atGoal && bossBlocking) {
    goalLockedHintTimer -= dt;
    if (goalLockedHintTimer <= 0) {
      goalLockedHintTimer = 2;
      floatingText.spawn(goal.x + 24, goal.y - 30, 'DEFEAT THE WHALE FIRST!', CONFIG.COLORS.TICKER_RED, 20, 1.5);
    }
  }
  if (atGoal && !bossBlocking) {
    audio.playLevelComplete();
    // Calculate time bonus: faster = more points
    const timeBonus = Math.max(0, Math.round(5000 - levelTime * 50));
    player.score += timeBonus;
    levelCompleteScreen = new LevelCompleteScreen();
    levelCompleteScreen.finalScore = player.score;
    levelCompleteScreen.bullsCollected = player.totalBullsCollected;
    levelCompleteScreen.timeTaken = levelTime;
    levelCompleteScreen.timeBonus = timeBonus;
    levelCompleteScreen.leaderboardStatus = 'skipped';
    currentState = GameState.LEVEL_COMPLETE;
  }

  // Update camera
  if (!player.deathAnimating) {
    camera.follow(player, dt);
  }

  // Update collectibles animation
  for (const c of level.collectibles) {
    if (c.type === 'runningDiamond') {
      c.update(dt, level.solids);
    } else if (c.fromBlock && !c.settled) {
      c.update(dt, level.solids);
    } else {
      c.update(dt);
    }
  }

  // Update particles
  particles.update(dt);
  floatingText.update(dt);

  // Update HUD
  hud.update(dt);
}

function render() {
  const scale = getScale();
  const offsetX = (canvas.width - CONFIG.VIRTUAL_WIDTH * scale) / 2;
  const offsetY = (canvas.height - CONFIG.VIRTUAL_HEIGHT * scale) / 2;

  // 3D world layer: drawn underneath, the 2D canvas stays transparent over it
  const use3D = !!(world3d && level && camera && currentState !== GameState.TITLE);
  if (world3d) {
    world3d.setActive(use3D);
    if (use3D) {
      world3d.layout(Math.round(offsetX), Math.round(offsetY),
        Math.round(CONFIG.VIRTUAL_WIDTH * scale), Math.round(CONFIG.VIRTUAL_HEIGHT * scale));
      world3d.render(level, camera, background.theme, gameTime,
        marketCrashActive ? marketCrashShakeOffset : null, player);
    }
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!use3D) {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  ctx.save();
  ctx.translate(offsetX, offsetY);
  ctx.scale(scale, scale);

  // Clip to virtual viewport
  ctx.beginPath();
  ctx.rect(0, 0, CONFIG.VIRTUAL_WIDTH, CONFIG.VIRTUAL_HEIGHT);
  ctx.clip();

  switch (currentState) {
    case GameState.TITLE:
      titleScreen.render(ctx, CONFIG.VIRTUAL_WIDTH, CONFIG.VIRTUAL_HEIGHT);
      break;

    case GameState.PLAYING:
      renderPlaying();
      if (gamePaused) renderPauseOverlay();
      break;

    case GameState.GAME_OVER:
      renderPlaying();
      gameOverScreen.render(ctx, CONFIG.VIRTUAL_WIDTH, CONFIG.VIRTUAL_HEIGHT);
      break;

    case GameState.LEVEL_COMPLETE:
      renderPlaying();
      levelCompleteScreen.render(ctx, CONFIG.VIRTUAL_WIDTH, CONFIG.VIRTUAL_HEIGHT);
      break;
  }

  ctx.restore();

  // Touch controls overlay (drawn in screen-space, outside game viewport transform)
  touchControls.render(ctx, canvas.width, canvas.height, currentState);
}

function renderPauseOverlay() {
